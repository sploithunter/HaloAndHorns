[data-egg-source]{cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none}#hh .egg-hit{position:relative;width:clamp(24px,calc(100vmin * var(--egg-hit-width) * var(--egg-projection) / max(1,var(--anchor-depth,10))),200px);height:clamp(22px,calc(100vmin * var(--egg-hit-height) * var(--egg-projection) / max(1,var(--anchor-depth,10))),240px);padding:0!important;min-height:0;border:0;border-radius:50%;background:transparent;box-shadow:none;overflow:visible}#hh .egg-hit:hover{background:#ffe4a022}#hh .egg-hit.egg-selected{box-shadow:0 0 0 2px #ffe28c88}#hh .egg-tier{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);background:#172334bd;border-radius:4px;padding:2px 5px;font-size:10px;color:#fff3c9;pointer-events:none}#hh .egg-empty{pointer-events:none;visibility:hidden}#hh .stand-label{position:absolute;left:50%;top:-26px;transform:translateX(-50%);white-space:nowrap;background:#19283ad9;border:1px solid #fff5;border-radius:7px;padding:5px 9px;font-size:11px;pointer-events:none}.stand-distant{visibility:hidden}body.hh-egg-dragging{cursor:grabbing;user-select:none}body.hh-egg-dragging #hh [data-egg-source]{cursor:grabbing}body.hh-egg-dragging #hh .egg-empty{visibility:visible;pointer-events:auto;border:1px dashed #fff6;background:#ffffff0c}body.hh-egg-dragging #hh .stand-distant{visibility:visible}body.hh-egg-dragging #hh .hatcher-drop{background:#a3e8c012;outline:2px dashed #c2f3d788}#hh [data-drop-hover=\"valid\"]{outline:3px solid #8af0b2!important;background:#75efa23b!important}#hh [data-drop-hover=\"invalid\"]{outline:3px solid #f3998b!important;background:#ef806b30!important}.hh-drag-ghost{position:fixed;z-index:100000;pointer-events:none;transform:translate(-50%,-50%);text-align:center;filter:drop-shadow(0 9px 7px #0005)}.hh-drag-ghost[hidden]{display:none!important}.hh-drag-egg{width:56px;height:76px;display:grid;place-items:center;border-radius:48% 48% 46% 46% / 60% 60% 40% 40%;background:radial-gradient(ellipse at 32% 24%,#ffffffb0