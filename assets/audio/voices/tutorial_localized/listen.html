s or place one on the line. Either counts. Do try to contain your relief.", "usage": "main", "locale": "es", "text": "Elige Deploy Best. Puede combinar huevos iguales o colocar uno en la línea. Ambas cosas cuentan. Intenta disimular el alivio.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD18.mp3"}, {"id": "ES_MD19", "cue": "merge_tutorial.hell.slots_lesson", "source_id": "MD19", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Two extra enhancement slots are yours to choose. Open Powers, place them, and Commit. You may reconsider before committing. A rare luxury.", "usage": "main", "locale": "es", "text": "Puedes elegir dos ranuras de mejora adicionales. Abre Powers, colócalas y usa Commit. Puedes cambiar de opinión antes de confirmar. Un lujo poco común.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD19.mp3"}, {"id": "ES_MD20", "cue": "merge_tutorial.hell.enhance_lesson", "source_id": "MD20", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Those new slots are not merely decorative. Choose a power in Powers, and fit it with an enhancement. Let’s see some improvement.", "usage": "main", "locale": "es", "text": "Esas ranuras nuevas no son solo decorativas. Elige un poder en Powers y ponle una mejora. Veamos algún avance.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD20.mp3"}, {"id": "ES_MD21", "cue": "merge_tutorial.hell.talk_quartermaster", "source_id": "MD21", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "That’s Macros, your Quartermaster. Boosts, enhancements, optional training. Visit when you like. For once, I am not giving you homework.", "usage": "main", "locale": "es", "text": "Ese es Macros, tu intendente. Potenciadores, mejoras, entrenamiento opcional. Visítalo cuando quieras. Por una vez, no te estoy dejando tarea.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD21.mp3"}, {"id": "ES_MD22", "cue": "merge_tutorial.hell.after_setup", "source_id": "MD22", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Eggs in one basket? How traditional. Try filling another hatcher; two smaller squads can serve you better than one powerful egg. Your defense, your decision.", "usage": "main", "locale": "es", "text": "¿Todos los huevos en una sola canasta? Qué clásico. Prueba poner un huevo en otra incubadora. Dos escuadrones pequeños pueden ayudarte más que un solo huevo poderoso. Tu defensa, tu decisión.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD22.mp3"}, {"id": "ES_MD23", "cue": "merge_tutorial.hell.after_bulwark", "source_id": "MD23", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "A wall, installed correctly. I shall try not to sound surprised. Let the next enemies test your handiwork.", "usage": "main", "locale": "es", "text": "Un muro bien instalado. Intentaré no parecer sorprendido. Deja que los próximos enemigos prueben tu obra.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD23.mp3"}, {"id": "ES_MD24", "cue": "merge_tutorial.hell.after_cannon", "source_id": "MD24", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "The Heal cannon is installed. Let’s see whether your defense survives long enough to earn its next lesson.", "usage": "main", "locale": "es", "text": "El cañón Heal está instalado. Veamos si tu defensa sobrevive lo suficiente para ganarse la próxima lección.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD24.mp3"}, {"id": "ES_MD25", "cue": "merge_tutorial.hell.after_power", "source_id": "MD25", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "A power of your own. Use it when it helps. I’d hate for it to become another expensive ornament.", "usage": "main", "locale": "es", "text": "Un poder propio. Úsalo cuando ayude. Me disgustaría que se convirtiera en otro adorno caro.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD25.mp3"}, {"id": "ES_MD26", "cue": "merge_tutorial.hell.after_upgrade", "source_id": "MD26", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "An improvement. I noticed. Your guardians may return to work while I recover from this unexpected competence.", "usage": "main", "locale": "es", "text": "Una mejora. Lo noté. Tus guardianes pueden volver al trabajo mientras me recupero de esta competencia inesperada.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD26.mp3"}, {"id": "ES_MD27", "cue": "merge_tutorial.hell.after_slots", "source_id": "MD27", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your slots are ready. Hold the line a little longer, and we’ll put something useful in one of them.", "usage": "main", "locale": "es", "text": "Tus ranuras están listas. Resiste un poquito más, y pondremos algo útil en una de ellas.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD27.mp3"}, {"id": "ES_MD28", "cue": "merge_tutorial.hell.after_enhance", "source_id": "MD28", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "An enhanced power. Better. Keep the defense going. You are becoming inconveniently capable.", "usage": "main", "locale": "es", "text": "Un poder mejorado. Bien. Mantén la defensa. Te estás volviendo inconvenientemente capaz.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD28.mp3"}, {"id": "ES_MD29", "cue": "merge_tutorial.hell.completion", "source_id": "MD29", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "That concludes your introduction to barely controlled chaos. Keep improving your defense. Explore if you like. You may even visit Farm and Fight. I shall endure your absence.", "usage": "main", "locale": "es", "text": "Aquí termina tu introducción al caos apenas controlado. Sigue mejorando tu defensa. Explora si quieres. Incluso puedes visitar Farm and Fight. Soportaré tu ausencia.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD29.mp3"}, {"id": "ES_MD30", "cue": "merge_tutorial.hell.resume", "source_id": "MD30", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Back for more? Your progress survived. Follow the guide, and we’ll resume the part you were so thoughtfully contemplating.", "usage": "main", "locale": "es", "text": "¿Volviste por más? Tu progreso sobrevivió. Sigue la guía y retomaremos esa parte que estabas contemplando con tanto cuidado.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD30.mp3"}, {"id": "ES_MD31", "cue": "merge_tutorial.hell.reminder", "source_id": "MD31", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your next step is still waiting by the glowing guide. No rush. The enemies have only their entire existence to spare.", "usage": "reminder", "locale": "es", "text": "Tu siguiente tarea sigue esperando junto al camino brillante. Sin prisa. Los enemigos solo tienen toda la eternidad por delante.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD31.mp3"}, {"id": "ES_MD32", "cue": "merge_tutorial.hell.help.power", "source_id": "MD32", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose a power, then Commit. Magnet is useful. So, I’m told, is making a decision.", "usage": "help", "locale": "es", "text": "Elige un poder y usa Commit. Magnet es útil. Tomar una decisión también lo es, según me cuentan.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD32.mp3"}, {"id": "ES_MD33", "cue": "merge_tutorial.hell.help.slots", "source_id": "MD33", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Place your extra slots on powers you own. Change your picks if you must, then Commit. Empty deliberation is not an enhancement.", "usage": "help", "locale": "es", "text": "Coloca tus ranuras adicionales en poderes que ya tengas. Cambia tus elecciones si hace falta y usa Commit. Reflexionar sin hacer nada no es una mejora.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD33.mp3"}, {"id": "ES_MD34", "cue": "merge_tutorial.hell.help.commit", "source_id": "MD34", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your choices are waiting. Commit to keep them, or adjust them first. Staring at the button is not a third option.", "usage": "help", "locale": "es", "text": "Tus elecciones están esperando. Usa Commit para confirmarlas, o ajústalas primero. Mirar fijamente el botón no es una tercera opción.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD34.mp3"}, {"id": "ES_MD35", "cue": "merge_tutorial.hell.help.owned", "source_id": "MD35", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose a power you own. We need somewhere to put the enhancement, preferably somewhere useful.", "usage": "help", "locale": "es", "text": "Elige un poder que tengas. Necesitamos dónde poner la mejora. Preferiblemente, en algún lugar útil.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD35.mp3"}, {"id": "ES_MD36", "cue": "merge_tutorial.hell.help.slot", "source_id": "MD36", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose an empty slot on that power. Yes, the empty one. We’re filling it, not admiring it.", "usage": "help", "locale": "es", "text": "Elige una ranura vacía en ese poder. Sí, la vacía. Vamos a llenarla, no a admirarla.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD36.mp3"}, {"id": "ES_MD37", "cue": "merge_tutorial.hell.help.enhancement", "source_id": "MD37", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose a fitting enhancement. Focus reduces the energy your power spends. Efficiency. Such a refreshing concept.", "usage": "help", "locale": "es", "text": "Elige una mejora compatible. Focus reduce la energía que gasta tu poder. Eficiencia. Qué concepto tan refrescante.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD37.mp3"}, {"id": "ES_MD38", "cue": "merge_tutorial.hell.help.apply", "source_id": "MD38", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Apply. The enhancement does rather more inside the power than it does sitting in a menu.", "usage": "help", "locale": "es", "text": "Elige Apply. La mejora hace bastante más dentro del poder que sentada en un menú.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD38.mp3"}, {"id": "ES_MD39", "cue": "merge_tutorial.hell.help.origin", "source_id": "MD39", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choosing an origin? That shapes the powers you can learn. Read the choices. Even I would not rush you through this one.", "usage": "help", "locale": "es", "text": "¿Eligiendo un origen? Eso define los poderes que puedes aprender. Lee las opciones. Ni yo te apuraría con esta decisión.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD39.mp3"}, {"id": "ES_MD40", "cue": "merge_tutorial.hell.help.origin_review", "source_id": "MD40", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "One last look before you confirm. Your origin is permanent. For this decision, thinking twice is entirely acceptable.", "usage": "help", "locale": "es", "text": "Una última revisión antes de confirmar. Tu origen es permanente. Para esta decisión, pensarlo dos veces es perfectamente aceptable.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD40.mp3"}, {"id": "BR_A01", "cue": "tutorial.hatch_first_egg", "source_id": "A01", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Your companion could use a friend. Follow the trail to the Earth Egg, and let’s wake one.", "usage": "main", "locale": "pt-br", "text": "Seu companheiro vai gostar de ter um amigo. Siga o caminho até o Ovo da Terra, e vamos acordar um.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A01.mp3"}, {"id": "BR_A02", "cue": "tutorial.farm_crystals", "source_id": "A02", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "See those crystals? With Farm Near on, your pets will mine beside you. Help them along, and we’ll soon have coins for another friend.", "usage": "main", "locale": "pt-br", "text": "Está vendo aqueles cristais? Com Farm Near ligado, seus pets mineram ao seu lado. Ajude um pouquinho, e logo teremos moedas para outro amigo.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A02.mp3"}, {"id": "BR_A03", "cue": "tutorial.hatch_another", "source_id": "A03", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "You’ve earned another egg. Shall we see who’s waiting inside? Every new friend gives your little squad more strength.", "usage": "main", "locale": "pt-br", "text": "Você conseguiu outro ovo. Vamos ver quem está esperando lá dentro? Cada novo amigo deixa seu pequeno esquadrão mais forte.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A03.mp3"}, {"id": "BR_A04", "cue": "tutorial.build_squad", "source_id": "A04", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "I’ve left a Rainbow Kitty in your inventory. Open Pets, and let’s make room for that bright little spark on your squad.", "usage": "main", "locale": "pt-br", "text": "Deixei um Gatinho Arco-Íris no seu inventário. Abra Pets, e vamos dar um lugar no seu esquadrão para essa pequena luz.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A04.mp3"}, {"id": "BR_A05", "cue": "tutorial.bind_power", "source_id": "A05", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There’s a gift within you, too. It’s called Resonance. Open Edit on your power bar, and give it a place where you can reach it.", "usage": "main", "locale": "pt-br", "text": "Você também tem um dom. Ele se chama Resonance. Abra Edit na sua barra de poderes e coloque esse poder onde fique fácil de usar.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A05.mp3"}, {"id": "BR_A06", "cue": "tutorial.cast_power", "source_id": "A06", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Now, try Resonance near the crystals. Feel that? Your power helps them break faster and yield a little more.", "usage": "main", "locale": "pt-br", "text": "Agora experimente Resonance perto dos cristais. Sentiu? Seu poder ajuda a quebrá-los mais rápido e a conseguir um pouquinho mais.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A06.mp3"}, {"id": "BR_A07", "cue": "tutorial.slot_power", "source_id": "A07", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "A little Potency will make that gift stronger. Open Powers, and let’s add your new enhancement to Resonance.", "usage": "main", "locale": "pt-br", "text": "Um pouco de Potency vai deixar esse dom mais forte. Abra Powers, e vamos colocar sua nova melhoria em Resonance.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A07.mp3"}, {"id": "BR_A08", "cue": "tutorial.first_fight", "source_id": "A08", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "The Earth cave is a place to practice fighting. Follow the trail when you’re ready. Its instructor has rather more horns than patience.", "usage": "main", "locale": "pt-br", "text": "A caverna da Terra é um lugar para praticar combate. Siga o caminho quando estiver pronto. O instrutor tem bem mais chifres do que paciência.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A08.mp3"}, {"id": "BR_A09", "cue": "tutorial.rally_call", "source_id": "A09", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "A good leader knows when to call everyone home. Try Rally—the flag on your power bar—and bring your pets back to your side.", "usage": "main", "locale": "pt-br", "text": "Um bom líder sabe quando chamar todo mundo de volta. Experimente Rally, a bandeira na sua barra de poderes, e traga seus pets para perto.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A09.mp3"}, {"id": "BR_A10", "cue": "tutorial.completion", "source_id": "A10", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Look how far you’ve come. The Ascension Altar is ready for you. Choose your next power, then follow your missions. There’s a whole world waiting.", "usage": "main", "locale": "pt-br", "text": "Olhe só quanto você avançou. O Altar de Ascensão está pronto para você. Escolha seu próximo poder e siga suas missões. Há um mundo inteiro esperando.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A10.mp3"}, {"id": "BR_A11", "cue": "tutorial.build_squad.guide.unequip", "source_id": "A11", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Your active squad is full. Let one pet rest in your inventory, and we can welcome the Kitty.", "usage": "help", "locale": "pt-br", "text": "Seu esquadrão ativo está cheio. Deixe um pet descansar no inventário, e podemos receber o Gatinho.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A11.mp3"}, {"id": "BR_A12", "cue": "tutorial.build_squad.guide.pick", "source_id": "A12", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There’s your Rainbow Kitty. Choose that little one for the open place on your squad.", "usage": "help", "locale": "pt-br", "text": "Ali está seu Gatinho Arco-Íris. Escolha ele para ocupar a vaga no seu esquadrão.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A12.mp3"}, {"id": "BR_A13", "cue": "tutorial.build_squad.guide.activate", "source_id": "A13", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "They’re ready. Choose Activate, and your new squad will join you.", "usage": "help", "locale": "pt-br", "text": "Está tudo pronto. Escolha Activate, e seu novo esquadrão vai se juntar a você.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A13.mp3"}, {"id": "BR_A14", "cue": "tutorial.bind_power.choose", "source_id": "A14", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Resonance and an open place on your power bar. Put it wherever feels right to you.", "usage": "help", "locale": "pt-br", "text": "Escolha Resonance e um espaço livre na sua barra de poderes. Coloque onde for mais confortável para você.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A14.mp3"}, {"id": "BR_A15", "cue": "tutorial.bind_power.done", "source_id": "A15", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There it is. Choose Done to finish setting your power bar.", "usage": "help", "locale": "pt-br", "text": "Pronto. Escolha Done para terminar de organizar sua barra de poderes.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A15.mp3"}, {"id": "BR_A16", "cue": "tutorial.slot_power.pick_power", "source_id": "A16", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Resonance. That’s the power we’re making stronger.", "usage": "help", "locale": "pt-br", "text": "Escolha Resonance. É esse poder que vamos fortalecer.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A16.mp3"}, {"id": "BR_A17", "cue": "tutorial.slot_power.pick_slot", "source_id": "A17", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "An empty enhancement slot is a little room to grow. Choose one on Resonance.", "usage": "help", "locale": "pt-br", "text": "Um espaço de melhoria vazio é uma chance de crescer. Escolha um em Resonance.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A17.mp3"}, {"id": "BR_A18", "cue": "tutorial.slot_power.pick_enhancement", "source_id": "A18", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Potency. It gives your crystal-boosting pulse a little more strength.", "usage": "help", "locale": "pt-br", "text": "Escolha Potency. Ela deixa um pouquinho mais forte o pulso que ajuda com seus cristais.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A18.mp3"}, {"id": "BR_A19", "cue": "tutorial.slot_power.apply", "source_id": "A19", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Apply, and that extra strength becomes yours.", "usage": "help", "locale": "pt-br", "text": "Escolha Apply, e essa força extra será sua.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A19.mp3"}, {"id": "BR_A20", "cue": "tutorial.farm_crystals.reminder", "source_id": "A20", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Try a small crystal nearby. Keep Farm Near on, and let your squad earn the coins together.", "usage": "help", "locale": "pt-br", "text": "Experimente um cristal pequeno por perto. Deixe Farm Near ligado e permita que seu esquadrão ganhe as moedas em equipe.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A20.mp3"}, {"id": "BR_A21", "cue": "tutorial.cast_power.reminder", "source_id": "A21", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Bring your squad close to the crystals before you use Resonance. That’s where its gift can help.", "usage": "help", "locale": "pt-br", "text": "Leve seu esquadrão para perto dos cristais antes de usar Resonance. É ali que esse dom pode ajudar.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A21.mp3"}, {"id": "BR_A22", "cue": "tutorial.first_fight.handoff", "source_id": "A22", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Of course. Training will be waiting in Quest whenever you’re ready. You can return to the Earth cave then.", "usage": "conditional", "locale": "pt-br", "text": "Claro. O treinamento vai esperar por você em Quest. Quando estiver pronto, pode voltar à caverna da Terra.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A22.mp3"}, {"id": "BR_A23", "cue": "tutorial.resume", "source_id": "A23", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Welcome back, little light. We’ll carry on from where you left off. Follow your current lesson when you’re ready.", "usage": "conditional", "locale": "pt-br", "text": "Que bom ter você de volta, minha luzinha. Vamos continuar de onde parou. Siga sua lição atual quando estiver pronto.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A23.mp3"}, {"id": "BR_A24", "cue": "tutorial.basic_return", "source_id": "A24", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Welcome back. I hope he remembered his manners. You’ve learned to look after your squad—and that matters far more than looking fearless.", "usage": "conditional", "locale": "pt-br", "text": "Bem-vindo de volta. Espero que ele tenha lembrado das boas maneiras. Você aprendeu a cuidar do seu esquadrão, e isso vale muito mais do que parecer destemido.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A24.mp3"}, {"id": "BR_A25", "cue": "tutorial.choose_companion", "source_id": "A25", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There you are, little light. Let’s choose your first companion. A bunny, a bear, a doggy, or a kitty — who will join you on your adventure?", "usage": "conditional", "locale": "pt-br", "text": "Aí está você, minha luzinha. Vamos escolher seu primeiro companheiro. Um coelhinho, um ursinho, um cachorrinho ou um gatinho... quem vai acompanhar você nesta aventura?", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A25.mp3"}, {"id": "BR_A26", "cue": "tutorial.hatch_first_egg.reminder", "source_id": "A26", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Your next little friend is waiting. Follow the glowing trail to the Earth Egg, and choose Hatch. I’ll be right here.", "usage": "reminder", "locale": "pt-br", "text": "Seu próximo amiguinho está esperando. Siga o caminho brilhante até o Ovo da Terra e abra um. Vou estar bem aqui.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A26.mp3"}, {"id": "BR_A27", "cue": "tutorial.next_task.reminder", "source_id": "A27", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Take your time, little light. When you’re ready, follow the glowing guide and try the next step. I know you can do it.", "usage": "reminder", "locale": "pt-br", "text": "Sem pressa, minha luzinha. Quando estiver pronto, siga a indicação brilhante e tente o próximo passo. Eu sei que você consegue.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/pt-br/angel/BR_A27.mp3"}, {"id": "BR_D01", "cue": "combat_tutorial.ready", "source_id": "D01", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "So. The angel sent me another promising little soul. Choose Enter on that frost door. I’ve found you something suitably unimpressive to fight.", "usage": "main", "locale": "pt-br", "text": "Ora. O anjo me mandou outra alminha promissora. Escolha Enter naquela porta congelada. Encontrei um adversário devidamente pouco impressionante para você.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D01.mp3"}, {"id": "BR_D02", "cue": "combat_tutorial.first_fight", "source_id": "D02", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There’s your opponent. Get close and let your pets do the fighting. Yes, they do most of the work. Try to look involved.", "usage": "main", "locale": "pt-br", "text": "Ali está seu oponente. Chegue perto e deixe seus pets lutarem. Sim, eles fazem quase todo o trabalho. Tente parecer envolvido.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D02.mp3"}, {"id": "BR_D03", "cue": "combat_tutorial.advance_stage", "source_id": "D03", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "One training dog defeated. Terrifying. The glowing pillar takes you back to the lobby. We’ll see if that was luck.", "usage": "main", "locale": "pt-br", "text": "Um cachorro de treinamento derrotado. Aterrorizante. O pilar brilhante leva você de volta ao saguão. Vamos ver se foi sorte.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D03.mp3"}, {"id": "BR_D04", "cue": "combat_tutorial.battle_brew", "source_id": "D04", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Berserk Brew. A little borrowed ferocity for your pets. Take a sip from your power bar. This is the safe room, after all.", "usage": "main", "locale": "pt-br", "text": "Berserk Brew. Um pouco de ferocidade emprestada para seus pets. Tome um gole pela barra de poderes. Afinal, esta é a sala segura.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D04.mp3"}, {"id": "BR_D05", "cue": "combat_tutorial.ready_brew", "source_id": "D05", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Feeling fierce? Enter the arena. Let’s find out whether your pets agree.", "usage": "main", "locale": "pt-br", "text": "Está se sentindo feroz? Entre na arena. Vamos descobrir se seus pets concordam.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D05.mp3"}, {"id": "BR_D06", "cue": "combat_tutorial.brew_fight", "source_id": "D06", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Notice the harder hits? That’s the brew. Finish this one before you start taking all the credit.", "usage": "main", "locale": "pt-br", "text": "Percebeu os golpes mais fortes? É a poção. Acabe com esse antes de começar a levar todo o crédito.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D06.mp3"}, {"id": "BR_D07", "cue": "combat_tutorial.advance_brew", "source_id": "D07", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Better. The pillar will bring you back. Next, we address your squad’s regrettable habit of getting hurt.", "usage": "main", "locale": "pt-br", "text": "Melhor. O pilar vai trazer você de volta. Agora vamos tratar desse hábito lamentável do seu esquadrão de se machucar.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D07.mp3"}, {"id": "BR_D08", "cue": "combat_tutorial.bind_heal", "source_id": "D08", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "You have Heal. How inconvenient for me. Open Edit, put it on your power bar, and finish with Done.", "usage": "main", "locale": "pt-br", "text": "Você tem Heal. Que inconveniente para mim. Abra Edit, coloque na barra de poderes e termine com Done.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D08.mp3"}, {"id": "BR_D09", "cue": "combat_tutorial.enhance_heal", "source_id": "D09", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Let’s make Heal worth using. Open Powers and give it the Healing enhancement I provided. I prefer my opponents properly prepared.", "usage": "main", "locale": "pt-br", "text": "Vamos fazer Heal valer a pena. Abra Powers e coloque a melhoria Healing que eu dei a você. Prefiro oponentes bem preparados.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D09.mp3"}, {"id": "BR_D10", "cue": "combat_tutorial.ready_heal", "source_id": "D10", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Your healing lesson awaits. Enter the arena—and do pay attention to your pets this time.", "usage": "main", "locale": "pt-br", "text": "Sua lição de cura está esperando. Entre na arena, e desta vez preste atenção nos seus pets.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D10.mp3"}, {"id": "BR_D11", "cue": "combat_tutorial.select_pet", "source_id": "D11", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "That yellow health bar belongs to your wounded pet. Select its card. Admiring the problem won’t mend it.", "usage": "main", "locale": "pt-br", "text": "Aquela barra de vida amarela é do seu pet ferido. Selecione o cartão dele. Admirar o problema não vai curá-lo.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D11.mp3"}, {"id": "BR_D12", "cue": "combat_tutorial.cast_heal", "source_id": "D12", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Now use Heal on the pet you selected. Once it recovers, those enemy shields come down. Consider that your warning.", "usage": "main", "locale": "pt-br", "text": "Agora use Heal no pet que você selecionou. Quando ele se recuperar, os escudos inimigos vão cair. Considere isso um aviso.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D12.mp3"}, {"id": "BR_D13", "cue": "combat_tutorial.heal_fight", "source_id": "D13", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Shields down. Finish both training dogs. The exit pillar is for winners, little hero.", "usage": "main", "locale": "pt-br", "text": "Escudos abaixados. Derrote os dois cachorros de treinamento. O pilar de saída é para vencedores, pequeno herói.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D13.mp3"}, {"id": "BR_D14", "cue": "combat_tutorial.advance_heal", "source_id": "D14", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "The room is clear. Use the glowing pillar to finish Basic Training. You’ve become slightly less likely to embarrass yourself.", "usage": "main", "locale": "pt-br", "text": "A sala está livre. Use o pilar brilhante para terminar o treinamento básico. Agora você tem um pouco menos de chance de passar vergonha.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D14.mp3"}, {"id": "BR_D15", "cue": "combat_tutorial.ready_weaken", "source_id": "D15", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Back for more? How irritatingly diligent. I’ve given you Weakening Vials. Enter the arena, and we’ll spoil someone’s defenses.", "usage": "main", "locale": "pt-br", "text": "Voltou para mais? Que dedicação irritante. Dei a você Weakening Vials. Entre na arena, e vamos estragar as defesas de alguém.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D15.mp3"}, {"id": "BR_D16", "cue": "combat_tutorial.select_enemy", "source_id": "D16", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose the marked enemy’s card. The vial needs a target. Throwing it at your own feet would make a very short lesson.", "usage": "main", "locale": "pt-br", "text": "Escolha o cartão do inimigo marcado. O frasco precisa de um alvo. Jogar nos próprios pés deixaria a lição bem curta.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D16.mp3"}, {"id": "BR_D17", "cue": "combat_tutorial.throw_weaken", "source_id": "D17", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Throw the Weakening Vial at your target. Down come the shields. Then you can get on with the unpleasant business of winning.", "usage": "main", "locale": "pt-br", "text": "Jogue o Weakening Vial no seu alvo. Lá se vão os escudos. Depois você pode cuidar dessa tarefa desagradável de vencer.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D17.mp3"}, {"id": "BR_D18", "cue": "combat_tutorial.weaken_fight", "source_id": "D18", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Their shields are gone. Defeat both dogs. No, the pillar won’t rescue you from unfinished work.", "usage": "main", "locale": "pt-br", "text": "Os escudos acabaram. Derrote os dois cachorros. Não, o pilar não vai salvar você do trabalho que ficou pela metade.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D18.mp3"}, {"id": "BR_D19", "cue": "combat_tutorial.advance_weaken", "source_id": "D19", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "You found a weakness and used it. Almost devious. Take the pillar back to the lobby.", "usage": "main", "locale": "pt-br", "text": "Você encontrou uma fraqueza e aproveitou. Quase malicioso. Use o pilar para voltar ao saguão.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D19.mp3"}, {"id": "BR_D20", "cue": "combat_tutorial.stack_brew", "source_id": "D20", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "More Berserk Brew means bigger hits, not a longer timer. Drink five sips. We’re building a damage meter, not a collection.", "usage": "main", "locale": "pt-br", "text": "Mais Berserk Brew significa golpes maiores, não mais tempo. Beba cinco goles. Estamos enchendo um medidor de dano, não fazendo uma coleção.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D20.mp3"}, {"id": "BR_D21", "cue": "combat_tutorial.ready_stack", "source_id": "D21", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There. A proper dose of trouble. Enter the arena while that damage meter has something left to give.", "usage": "main", "locale": "pt-br", "text": "Pronto. Uma boa dose de problemas. Entre na arena enquanto esse medidor de dano ainda tem algo a oferecer.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D21.mp3"}, {"id": "BR_D22", "cue": "combat_tutorial.stack_fight", "source_id": "D22", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Now watch those hits. Much more convincing. Finish the dog before your borrowed courage wears off.", "usage": "main", "locale": "pt-br", "text": "Agora veja esses golpes. Muito mais convincentes. Acabe com o cachorro antes que sua coragem emprestada passe.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D22.mp3"}, {"id": "BR_D23", "cue": "combat_tutorial.advance_stack", "source_id": "D23", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "That was almost efficient. The glowing pillar finishes this course. I suppose you’ll want your reward.", "usage": "main", "locale": "pt-br", "text": "Isso foi quase eficiente. O pilar brilhante encerra este curso. Suponho que você queira sua recompensa.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D23.mp3"}, {"id": "BR_D24", "cue": "combat_tutorial.ready_tank", "source_id": "D24", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Let’s put something sturdier between your squad and disaster. Open Pets. One doggy is making room for a bear.", "usage": "main", "locale": "pt-br", "text": "Vamos pôr algo mais resistente entre seu esquadrão e o desastre. Abra Pets. Um cachorrinho vai dar lugar a um urso.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D24.mp3"}, {"id": "BR_D25", "cue": "combat_tutorial.tank_fight", "source_id": "D25", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "The tank draws attention and takes the punishment. It hits less hard, but your other pets get to keep their dignity—and their health. Finish the fight.", "usage": "main", "locale": "pt-br", "text": "O tanque chama a atenção e aguenta os golpes. Ele bate menos forte, mas seus outros pets mantêm a dignidade e a vida. Termine a luta.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D25.mp3"}, {"id": "BR_D26", "cue": "combat_tutorial.advance_tank", "source_id": "D26", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Still standing. How tiresome. Take the pillar back; your next opponents have learned a little trick.", "usage": "main", "locale": "pt-br", "text": "Ainda de pé. Que cansativo. Volte pelo pilar; seus próximos oponentes aprenderam um truquezinho.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D26.mp3"}, {"id": "BR_D27", "cue": "combat_tutorial.ready_healer", "source_id": "D27", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "The next pack brought a healer. Leave it alone and it will keep repairing your hard work. Enter when you’ve grasped the problem.", "usage": "main", "locale": "pt-br", "text": "O próximo grupo trouxe um curandeiro. Deixe ele em paz, e vai continuar desfazendo todo o seu esforço. Entre quando entender o problema.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D27.mp3"}, {"id": "BR_D28", "cue": "combat_tutorial.healer_hunt", "source_id": "D28", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "That green healing mark is your clue. Send your pets after the healer first. I’d rather you didn’t, which should tell you everything.", "usage": "main", "locale": "pt-br", "text": "A marca verde de cura é sua pista. Mande seus pets atrás do curandeiro primeiro. Eu preferia que não fizesse isso, o que já diz tudo.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D28.mp3"}, {"id": "BR_D29", "cue": "combat_tutorial.healer_fight", "source_id": "D29", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Healer down. Now finish the rest of the pack. They’re suddenly much less optimistic.", "usage": "main", "locale": "pt-br", "text": "Curandeiro derrotado. Agora acabe com o resto do grupo. De repente, eles ficaram bem menos otimistas.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D29.mp3"}, {"id": "BR_D30", "cue": "combat_tutorial.advance_healer", "source_id": "D30", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There. No one left to patch them up. Back through the pillar. One last room, and I stop holding your hand.", "usage": "main", "locale": "pt-br", "text": "Pronto. Não sobrou ninguém para curar os outros. Volte pelo pilar. Só mais uma sala, e eu paro de segurar sua mão.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D30.mp3"}, {"id": "BR_D31", "cue": "combat_tutorial.ready_together", "source_id": "D31", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Final room. Two dogs, one healer, and no helpful arrows. You have the tools. Enter when you’re ready to make me regret teaching you.", "usage": "main", "locale": "pt-br", "text": "Última sala. Dois cachorros, um curandeiro e nenhuma seta de ajuda. Você tem as ferramentas. Entre quando estiver pronto para me fazer lamentar ter ensinado você.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D31.mp3"}, {"id": "BR_D32", "cue": "combat_tutorial.together_fight", "source_id": "D32", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "All yours, little hero. Clear the room. Let’s see what you remember when I stop telling you.", "usage": "main", "locale": "pt-br", "text": "Tudo seu, pequeno herói. Limpe a sala. Vamos ver o que você lembra quando eu paro de explicar.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D32.mp3"}, {"id": "BR_D33", "cue": "combat_tutorial.advance_together", "source_id": "D33", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "No arrows, and you still managed it. Deeply inconvenient. Take the glowing pillar and finish your training.", "usage": "main", "locale": "pt-br", "text": "Sem setas, e mesmo assim conseguiu. Profundamente inconveniente. Use o pilar brilhante e termine seu treinamento.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D33.mp3"}, {"id": "BR_D34", "cue": "combat_courses.basic.completion", "source_id": "D34", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Basic Training, complete. Your pets and powers are ready for the world. Advanced lessons are optional. I’m sure you’ll miss my encouragement.", "usage": "completion", "locale": "pt-br", "text": "Treinamento básico concluído. Seus pets e poderes estão prontos para o mundo. As lições avançadas são opcionais. Tenho certeza de que vai sentir falta do meu incentivo.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D34.mp3"}, {"id": "BR_D35", "cue": "combat_courses.advanced_1.completion", "source_id": "D35", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Advanced One, complete. You’ve earned a Double XP token. Use it from your inventory when you want the extra experience. Do try to make it count.", "usage": "completion", "locale": "pt-br", "text": "Avançado um, concluído. Você ganhou uma ficha de experiência em dobro. Use pelo inventário quando quiser experiência extra. Tente fazer valer a pena.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D35.mp3"}, {"id": "BR_D36", "cue": "combat_courses.advanced_2.completion", "source_id": "D36", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "All courses complete. There’s a Double Coins token waiting in your inventory. Use it when you’re ready. You’ve become a rather troublesome little hero.", "usage": "completion", "locale": "pt-br", "text": "Todos os cursos concluídos. Uma ficha de moedas em dobro espera no seu inventário. Use quando quiser. Você virou um pequeno herói bastante problemático.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D36.mp3"}, {"id": "BR_D37", "cue": "combat_tutorial.bind_heal.choose", "source_id": "D37", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Heal, then give it a place on your power bar. Ideally somewhere you’ll remember when things start biting.", "usage": "help", "locale": "pt-br", "text": "Escolha Heal e dê um lugar a ele na barra de poderes. De preferência onde você lembre quando começarem as mordidas.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D37.mp3"}, {"id": "BR_D38", "cue": "combat_tutorial.bind_heal.done", "source_id": "D38", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Now choose Done. You can admire your arrangement after you survive.", "usage": "help", "locale": "pt-br", "text": "Agora escolha Done. Você pode admirar sua organização depois de sobreviver.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D38.mp3"}, {"id": "BR_D39", "cue": "combat_tutorial.enhance_heal.pick_power", "source_id": "D39", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Heal. We’re improving that power, not browsing for something prettier.", "usage": "help", "locale": "pt-br", "text": "Escolha Heal. Estamos melhorando esse poder, não procurando algo mais bonito.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D39.mp3"}, {"id": "BR_D40", "cue": "combat_tutorial.enhance_heal.pick_slot", "source_id": "D40", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose an empty slot on Heal. Even your good intentions need somewhere to go.", "usage": "help", "locale": "pt-br", "text": "Escolha um espaço vazio em Heal. Até suas boas intenções precisam de um lugar.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D40.mp3"}, {"id": "BR_D41", "cue": "combat_tutorial.enhance_heal.pick_enhancement", "source_id": "D41", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Healing. The name is a subtle clue.", "usage": "help", "locale": "pt-br", "text": "Escolha Healing. O nome é uma pista bem sutil.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D41.mp3"}, {"id": "BR_D42", "cue": "combat_tutorial.enhance_heal.apply", "source_id": "D42", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Apply it. A staged enhancement is doing precisely nothing for you.", "usage": "help", "locale": "pt-br", "text": "Use Apply. Uma melhoria que ainda não foi aplicada não está ajudando em absolutamente nada.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D42.mp3"}, {"id": "BR_D43", "cue": "combat_tutorial.ready_tank.guide.unequip", "source_id": "D43", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Take a doggy off your active squad. The bear needs a place, not an invitation to an already full party.", "usage": "help", "locale": "pt-br", "text": "Tire um cachorrinho do esquadrão ativo. O urso precisa de uma vaga, não de um convite para uma festa que já está lotada.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D43.mp3"}, {"id": "BR_D44", "cue": "combat_tutorial.ready_tank.guide.pick", "source_id": "D44", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose your strongest bear. The Tank option in Best Pets can find it for you, if counting muscles proves difficult.", "usage": "help", "locale": "pt-br", "text": "Escolha seu urso mais forte. A opção Tank em Best Pets pode encontrar ele para você, se contar músculos for difícil.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D44.mp3"}, {"id": "BR_D45", "cue": "combat_tutorial.ready_tank.guide.activate", "source_id": "D45", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Activate. I need the bear in the fight, not posing in your inventory.", "usage": "help", "locale": "pt-br", "text": "Escolha Activate. Preciso do urso na luta, não fazendo pose no inventário.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D45.mp3"}, {"id": "BR_D46", "cue": "combat_tutorial.ready_tank.guide.close", "source_id": "D46", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "The bear is on your squad. Close Pets so we can get on with it.", "usage": "help", "locale": "pt-br", "text": "O urso está no seu esquadrão. Feche Pets para continuarmos.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D46.mp3"}, {"id": "BR_D47", "cue": "combat_tutorial.ready_tank.guide.enter", "source_id": "D47", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Your tank is ready. Enter the arena and let it earn its place.", "usage": "help", "locale": "pt-br", "text": "Seu tanque está pronto. Entre na arena e deixe ele merecer a vaga.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D47.mp3"}, {"id": "BR_D48", "cue": "combat_courses.menu", "source_id": "D48", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Basic first. Then, if you insist on improving, two advanced courses await. Choose your lesson, little hero.", "usage": "conditional", "locale": "pt-br", "text": "O básico primeiro. Depois, se insistir em melhorar, dois cursos avançados esperam por você. Escolha sua lição, pequeno herói.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D48.mp3"}, {"id": "BR_D49", "cue": "combat_courses.locked", "source_id": "D49", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Finish the earlier course first. Skipping the lesson is not the same as mastering it.", "usage": "conditional", "locale": "pt-br", "text": "Termine o curso anterior primeiro. Pular uma lição não é o mesmo que dominar o assunto.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D49.mp3"}, {"id": "BR_D50", "cue": "combat_courses.replay.start", "source_id": "D50", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "A repeat performance? Very well. The practice is yours; the first-time reward stays first-time.", "usage": "conditional", "locale": "pt-br", "text": "Vai repetir a apresentação? Muito bem. A prática é sua; a recompensa de primeira vez continua sendo de primeira vez.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D50.mp3"}, {"id": "BR_D51", "cue": "combat_courses.replay.completion", "source_id": "D51", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Finished again. No second reward, of course. Surely my company was compensation enough.", "usage": "conditional", "locale": "pt-br", "text": "Terminou de novo. Sem segunda recompensa, é claro. Certamente minha companhia já foi compensação suficiente.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D51.mp3"}, {"id": "BR_D52", "cue": "combat_tutorial.leave_confirm", "source_id": "D52", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Leaving already? Your progress is saved. Come back when you’re ready to disappoint me properly.", "usage": "conditional", "locale": "pt-br", "text": "Já vai embora? Seu progresso está salvo. Volte quando estiver pronto para me decepcionar direito.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D52.mp3"}, {"id": "BR_D53", "cue": "combat_tutorial.resume", "source_id": "D53", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Back, are you? Your completed lessons still count. We’ll prepare this round again before you enter.", "usage": "conditional", "locale": "pt-br", "text": "Voltou, foi? Suas lições concluídas continuam valendo. Vamos preparar esta rodada de novo antes de você entrar.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D53.mp3"}, {"id": "BR_D54", "cue": "combat_tutorial.door.pets_equipped", "source_id": "D54", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Bring at least one pet. This is combat training, not an audition for the role of bait.", "usage": "conditional", "locale": "pt-br", "text": "Traga pelo menos um pet. Isto é treinamento de combate, não uma audição para o papel de isca.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D54.mp3"}, {"id": "BR_D55", "cue": "combat_tutorial.door.hotbar_not_editing", "source_id": "D55", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Done on your power bar first. I prefer my opponents assembled before the fight.", "usage": "conditional", "locale": "pt-br", "text": "Escolha Done na barra de poderes primeiro. Prefiro meus oponentes organizados antes da luta.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D55.mp3"}, {"id": "BR_D56", "cue": "combat_tutorial.door.heal_unbound", "source_id": "D56", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Heal belongs on your power bar. Put it there before asking that door to open.", "usage": "conditional", "locale": "pt-br", "text": "Heal precisa estar na barra de poderes. Coloque lá antes de pedir para a porta abrir.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D56.mp3"}, {"id": "BR_D57", "cue": "combat_tutorial.door.heal_unenhanced", "source_id": "D57", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Add Healing to Heal and apply it. Then we can discuss opening the door.", "usage": "conditional", "locale": "pt-br", "text": "Coloque Healing em Heal e use Apply. Depois podemos conversar sobre abrir a porta.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D57.mp3"}, {"id": "BR_D58", "cue": "combat_tutorial.door.brew_unused", "source_id": "D58", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "The Berserk Brew is for drinking. One sip, little hero. Then you may enter.", "usage": "conditional", "locale": "pt-br", "text": "Berserk Brew é para beber. Um gole, pequeno herói. Depois pode entrar.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D58.mp3"}, {"id": "BR_D59", "cue": "combat_tutorial.door.tank_missing", "source_id": "D59", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "A bear on your active squad, please. Owning a tank is not the same as bringing one.", "usage": "conditional", "locale": "pt-br", "text": "Um urso no esquadrão ativo, por favor. Ter um tanque não é o mesmo que trazer um.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D59.mp3"}, {"id": "BR_D60", "cue": "combat_tutorial.stack_brew.remaining_4", "source_id": "D60", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Four more sips. That meter isn’t filling itself.", "usage": "conditional", "locale": "pt-br", "text": "Mais quatro goles. Esse medidor não vai se encher sozinho.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D60.mp3"}, {"id": "BR_D61", "cue": "combat_tutorial.stack_brew.remaining_3", "source_id": "D61", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Three more. I admire your commitment to doing this slowly.", "usage": "conditional", "locale": "pt-br", "text": "Mais três. Admiro sua dedicação a fazer isso devagar.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D61.mp3"}, {"id": "BR_D62", "cue": "combat_tutorial.stack_brew.remaining_2", "source_id": "D62", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Two more sips. Even I can see you’re nearly there.", "usage": "conditional", "locale": "pt-br", "text": "Mais dois goles. Até eu vejo que está quase lá.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D62.mp3"}, {"id": "BR_D63", "cue": "combat_tutorial.stack_brew.remaining_1", "source_id": "D63", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "One more. Let’s not lose our nerve at the finish.", "usage": "conditional", "locale": "pt-br", "text": "Mais um. Não vamos perder a coragem bem no final.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D63.mp3"}, {"id": "BR_D64", "cue": "combat_tutorial.healer_hunt.lost", "source_id": "D64", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Your pets have wandered off the healer. Select it again. We were so close to having a strategy.", "usage": "conditional", "locale": "pt-br", "text": "Seus pets se afastaram do curandeiro. Selecione ele de novo. Estávamos tão perto de ter uma estratégia.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D64.mp3"}, {"id": "BR_D65", "cue": "combat_tutorial.next_task.reminder", "source_id": "D65", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Admiring the scenery? Charming. Your next lesson is waiting. Follow the guide when you’re ready, little hero.", "usage": "reminder", "locale": "pt-br", "text": "Admirando a paisagem? Encantador. Sua próxima lição está esperando. Siga a indicação quando estiver pronto, pequeno herói.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/pt-br/demon/BR_D65.mp3"}, {"id": "BR_MA01", "cue": "merge_tutorial.heaven.collect_setup", "source_id": "MA01", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Welcome to your little corner of Heaven. Follow the glowing trail to gather the Waycoins, then the gem. We’ll turn them into a brave little defense.", "usage": "main", "locale": "pt-br", "text": "Bem-vindo ao seu cantinho do Céu. Siga o caminho brilhante para recolher as Waycoins e depois a gema. Vamos transformar tudo numa pequena defesa corajosa.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA01.mp3"}, {"id": "BR_MA02", "cue": "merge_tutorial.heaven.collect_setup.auto", "source_id": "MA02", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your Coin Pup is already gathering our supplies. Let that helpful little nose collect the coins and gem; then we’ll put them to good use.", "usage": "main", "locale": "pt-br", "text": "Seu Coin Pup já está reunindo os suprimentos. Deixe esse pequeno ajudante recolher as moedas e a gema; depois vamos usar tudo direitinho.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA02.mp3"}, {"id": "BR_MA03", "cue": "merge_tutorial.heaven.create_five", "source_id": "MA03", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Now, let’s build your first defense. Use Buy Egg to create five Earth Eggs. There’s a whole little squad waiting to begin.", "usage": "main", "locale": "pt-br", "text": "Agora vamos montar sua primeira defesa. Use Buy Egg para criar cinco Ovos da Terra. Um pequeno esquadrão inteiro está esperando para começar.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA03.mp3"}, {"id": "BR_MA04", "cue": "merge_tutorial.heaven.deploy_best", "source_id": "MA04", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Lovely. Choose Deploy Best, and your eggs will take their places on the defense line. Your little guardians can handle the first arrivals.", "usage": "main", "locale": "pt-br", "text": "Que ótimo. Escolha Deploy Best, e seus ovos vão ocupar seus lugares na linha de defesa. Seus pequenos guardiões dão conta dos primeiros visitantes.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA04.mp3"}, {"id": "BR_MA05", "cue": "merge_tutorial.heaven.collect_workshop_coins", "source_id": "MA05", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Before we strengthen the line, gather a Waycoin pile. The engineer needs a little funding to bring his work to life.", "usage": "main", "locale": "pt-br", "text": "Antes de fortalecer a linha, recolha uma pilha de Waycoins. O engenheiro precisa de uma ajudinha para colocar o trabalho em prática.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA05.mp3"}, {"id": "BR_MA06", "cue": "merge_tutorial.heaven.talk_engineer", "source_id": "MA06", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Our engineer has arrived at the gold line. Follow the guide and speak with him. A sturdy defense can give every guardian a little more time.", "usage": "main", "locale": "pt-br", "text": "Nosso engenheiro chegou à linha dourada. Siga a indicação e fale com ele. Uma defesa resistente pode dar um pouquinho mais de tempo a cada guardião.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA06.mp3"}, {"id": "BR_MA07", "cue": "merge_tutorial.heaven.unlock_bulwark", "source_id": "MA07", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Unlock the Impaler Palisade with your gem. Those sharp little points will help your new wall stand up to trouble.", "usage": "main", "locale": "pt-br", "text": "Desbloqueie Impaler Palisade com sua gema. Aquelas pontinhas vão ajudar sua nova muralha a resistir aos problemas.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA07.mp3"}, {"id": "BR_MA08", "cue": "merge_tutorial.heaven.install_bulwark", "source_id": "MA08", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Now choose Install. There—another layer of protection for your brave little defenders. We’re building something worth holding onto.", "usage": "main", "locale": "pt-br", "text": "Agora escolha Install. Pronto, mais uma camada de proteção para seus valentes defensores. Estamos construindo algo que vale a pena cuidar.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA08.mp3"}, {"id": "BR_MA09", "cue": "merge_tutorial.heaven.collect_cannon_coins", "source_id": "MA09", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Gather a Waycoin pile for the next improvement. A little support from the artillery commander will help your line last longer.", "usage": "main", "locale": "pt-br", "text": "Recolha uma pilha de Waycoins para a próxima melhoria. Um pouco de apoio do comandante de artilharia vai ajudar sua linha a durar mais.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA09.mp3"}, {"id": "BR_MA10", "cue": "merge_tutorial.heaven.collect_cannon_gem", "source_id": "MA10", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Follow the guide to the gem. Keep it close; it will unlock a cannon that helps mend your defense.", "usage": "main", "locale": "pt-br", "text": "Siga a indicação até a gema. Guarde bem; ela vai desbloquear um canhão que ajuda a consertar sua defesa.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA10.mp3"}, {"id": "BR_MA11", "cue": "merge_tutorial.heaven.talk_commander", "source_id": "MA11", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "The artillery commander is ready at the right-hand gun. Follow the guide and speak with him. Even the strongest line deserves a little care.", "usage": "main", "locale": "pt-br", "text": "O comandante de artilharia está pronto junto ao canhão da direita. Siga a indicação e fale com ele. Até a linha mais forte merece um pouquinho de cuidado.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA11.mp3"}, {"id": "BR_MA12", "cue": "merge_tutorial.heaven.unlock_cannon", "source_id": "MA12", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Unlock for the Heal cannon. Your gem will open a gentler kind of artillery—one that helps keep your defense standing.", "usage": "main", "locale": "pt-br", "text": "Escolha Unlock para o canhão Heal. Sua gema vai abrir caminho para uma artilharia mais gentil, que ajuda a manter sua defesa de pé.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA12.mp3"}, {"id": "BR_MA13", "cue": "merge_tutorial.heaven.install_cannon", "source_id": "MA13", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Install, and let the Heal cannon join your defense. A little kindness in the right place can make a wonderful difference.", "usage": "main", "locale": "pt-br", "text": "Escolha Install e deixe o canhão Heal se juntar à defesa. Um pouco de gentileza no lugar certo pode fazer uma bela diferença.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA13.mp3"}, {"id": "BR_MA14", "cue": "merge_tutorial.heaven.power_lesson", "source_id": "MA14", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "You’ve earned a new power. Open Powers and choose one, then Commit. Magnet is a helpful first choice for bringing scattered loot a little closer.", "usage": "main", "locale": "pt-br", "text": "Você ganhou um novo poder. Abra Powers, escolha um e use Commit. Magnet é uma boa primeira escolha para trazer o saque espalhado para mais perto.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA14.mp3"}, {"id": "BR_MA15", "cue": "merge_tutorial.heaven.collect_upgrade_coins", "source_id": "MA15", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Let’s gather a few more Waycoins for your eggs. Follow the guide; a stronger line begins with one small improvement at a time.", "usage": "main", "locale": "pt-br", "text": "Vamos recolher mais algumas Waycoins para seus ovos. Siga a indicação; uma linha mais forte começa com uma pequena melhoria de cada vez.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA15.mp3"}, {"id": "BR_MA16", "cue": "merge_tutorial.heaven.collect_upgrade_coins.auto", "source_id": "MA16", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your Coin Pup will gather what we need. Give that faithful little helper a moment, and we’ll improve your defense together.", "usage": "main", "locale": "pt-br", "text": "Seu Coin Pup vai recolher o que precisamos. Dê um momento a esse ajudante fiel, e vamos melhorar sua defesa juntos.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA16.mp3"}, {"id": "BR_MA17", "cue": "merge_tutorial.heaven.upgrade_eggs", "source_id": "MA17", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Let’s give your line a little more strength. Buy a couple of eggs, then use Deploy Best. If you already have an egg, placing it works too.", "usage": "main", "locale": "pt-br", "text": "Vamos dar um pouquinho mais de força à sua linha. Compre dois ovos e use Deploy Best. Se já tiver um ovo, colocar ele na linha também serve.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA17.mp3"}, {"id": "BR_MA18", "cue": "merge_tutorial.heaven.upgrade_eggs.deploy", "source_id": "MA18", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your eggs are ready. Choose Deploy Best to combine matching eggs or place one on the line. Either is a good next step.", "usage": "main", "locale": "pt-br", "text": "Seus ovos estão prontos. Escolha Deploy Best para combinar ovos iguais ou colocar um na linha. Qualquer uma das opções é um bom próximo passo.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA18.mp3"}, {"id": "BR_MA19", "cue": "merge_tutorial.heaven.slots_lesson", "source_id": "MA19", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Let’s make room for your powers to grow. In Powers, choose two extra enhancement slots, then Commit. You can change your picks before committing.", "usage": "main", "locale": "pt-br", "text": "Vamos abrir espaço para seus poderes crescerem. Em Powers, escolha dois espaços extras de melhoria e use Commit. Você pode mudar suas escolhas antes de confirmar.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA19.mp3"}, {"id": "BR_MA20", "cue": "merge_tutorial.heaven.enhance_lesson", "source_id": "MA20", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Now we can give a power a little more sparkle. Choose it in Powers, and let’s fit an enhancement into one of its slots.", "usage": "main", "locale": "pt-br", "text": "Agora podemos dar um pouquinho mais de brilho a um poder. Escolha ele em Powers, e vamos encaixar uma melhoria num dos espaços.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA20.mp3"}, {"id": "BR_MA21", "cue": "merge_tutorial.heaven.talk_quartermaster", "source_id": "MA21", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Meet Macros, your Quartermaster. He has boosts, enhancements, and optional training whenever you want them. There’s no need to visit right now; your adventure is yours.", "usage": "main", "locale": "pt-br", "text": "Conheça Macros, seu intendente. Ele tem reforços, melhorias e treinamento opcional quando você quiser. Não precisa visitar agora; a aventura é sua.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA21.mp3"}, {"id": "BR_MA22", "cue": "merge_tutorial.heaven.after_setup", "source_id": "MA22", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your guardians are ready. Try spreading your defense across more hatchers; two smaller squads can serve you better than one powerful egg. It’s your choice.", "usage": "main", "locale": "pt-br", "text": "Seus guardiões estão prontos. Experimente espalhar sua defesa por mais incubadoras. Dois esquadrões pequenos podem ajudar mais do que um único ovo poderoso. Você escolhe.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA22.mp3"}, {"id": "BR_MA23", "cue": "merge_tutorial.heaven.after_bulwark", "source_id": "MA23", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your wall is in place. Let’s see how the line holds now. Each small improvement gives your guardians a little more breathing room.", "usage": "main", "locale": "pt-br", "text": "Sua muralha está no lugar. Vamos ver como a linha resiste agora. Cada pequena melhoria dá um pouquinho mais de fôlego aos seus guardiões.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA23.mp3"}, {"id": "BR_MA24", "cue": "merge_tutorial.heaven.after_cannon", "source_id": "MA24", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your Heal cannon is ready. Keep the defense going; there’s a new power waiting a little further along.", "usage": "main", "locale": "pt-br", "text": "Seu canhão Heal está pronto. Continue defendendo; há um novo poder esperando um pouco mais à frente.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA24.mp3"}, {"id": "BR_MA25", "cue": "merge_tutorial.heaven.after_power", "source_id": "MA25", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "That power is yours now. Try it when it will help, and keep your defense growing. You’re finding your own way.", "usage": "main", "locale": "pt-br", "text": "Esse poder agora é seu. Experimente quando puder ajudar e continue fortalecendo sua defesa. Você está encontrando seu próprio caminho.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA25.mp3"}, {"id": "BR_MA26", "cue": "merge_tutorial.heaven.after_upgrade", "source_id": "MA26", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "That’s a little stronger already. Let your guardians get back to work. You can keep improving the line as you go.", "usage": "main", "locale": "pt-br", "text": "Já ficou um pouquinho mais forte. Deixe seus guardiões voltarem ao trabalho. Você pode continuar melhorando a linha enquanto avança.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA26.mp3"}, {"id": "BR_MA27", "cue": "merge_tutorial.heaven.after_slots", "source_id": "MA27", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your extra slots are ready. Keep the line steady, and soon we’ll give one of your powers a useful enhancement.", "usage": "main", "locale": "pt-br", "text": "Seus espaços extras estão prontos. Mantenha a linha firme, e logo vamos dar uma melhoria útil a um dos seus poderes.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA27.mp3"}, {"id": "BR_MA28", "cue": "merge_tutorial.heaven.after_enhance", "source_id": "MA28", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "There—that power has a little more to offer. Keep going; you’ve nearly learned everything you need to manage this defense yourself.", "usage": "main", "locale": "pt-br", "text": "Pronto, esse poder tem um pouquinho mais a oferecer. Continue; você já aprendeu quase tudo de que precisa para cuidar dessa defesa por conta própria.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA28.mp3"}, {"id": "BR_MA29", "cue": "merge_tutorial.heaven.completion", "source_id": "MA29", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "You’ve learned the essentials, little light. Keep growing your defense, explore when you wish, and remember: you can always take a breather in Farm and Fight.", "usage": "main", "locale": "pt-br", "text": "Você aprendeu o essencial, minha luzinha. Continue fortalecendo sua defesa e explore quando quiser. Lembre que sempre pode respirar um pouco em Farm and Fight.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA29.mp3"}, {"id": "BR_MA30", "cue": "merge_tutorial.heaven.resume", "source_id": "MA30", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Welcome back, little light. Your progress is still here. Follow the guide, and we’ll pick up with the step you were working on.", "usage": "main", "locale": "pt-br", "text": "Bem-vindo de volta, minha luzinha. Seu progresso continua aqui. Siga a indicação, e vamos retomar o passo em que você estava.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA30.mp3"}, {"id": "BR_MA31", "cue": "merge_tutorial.heaven.reminder", "source_id": "MA31", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Whenever you’re ready, little light, the glowing guide will show your next step. Take your time. We’ll build this together.", "usage": "reminder", "locale": "pt-br", "text": "Quando estiver pronto, minha luzinha, a indicação brilhante vai mostrar o próximo passo. Sem pressa. Vamos construir isso juntos.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA31.mp3"}, {"id": "BR_MA32", "cue": "merge_tutorial.heaven.help.power", "source_id": "MA32", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Magnet is a helpful beginning. Choose the power you want, then Commit when you’re happy with your choice.", "usage": "help", "locale": "pt-br", "text": "Magnet é um bom começo. Escolha o poder que quiser e use Commit quando estiver contente com a escolha.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA32.mp3"}, {"id": "BR_MA33", "cue": "merge_tutorial.heaven.help.slots", "source_id": "MA33", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose two extra slots on powers you own. You can put them where they’ll help most, and change your picks before you Commit.", "usage": "help", "locale": "pt-br", "text": "Escolha dois espaços extras em poderes que você já tem. Coloque onde puderem ajudar mais e mude suas escolhas antes de usar Commit, se quiser.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA33.mp3"}, {"id": "BR_MA34", "cue": "merge_tutorial.heaven.help.commit", "source_id": "MA34", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your choices are ready. Choose Commit to make them yours, or adjust them first if something doesn’t feel right.", "usage": "help", "locale": "pt-br", "text": "Suas escolhas estão prontas. Use Commit para confirmar, ou ajuste primeiro se alguma coisa não parecer certa.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA34.mp3"}, {"id": "BR_MA35", "cue": "merge_tutorial.heaven.help.owned", "source_id": "MA35", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose one of your powers. Then we can look at its slots and find a home for that enhancement.", "usage": "help", "locale": "pt-br", "text": "Escolha um dos seus poderes. Depois podemos olhar os espaços e encontrar um lugar para essa melhoria.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA35.mp3"}, {"id": "BR_MA36", "cue": "merge_tutorial.heaven.help.slot", "source_id": "MA36", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose an empty enhancement slot on that power. A small space, with room for something helpful.", "usage": "help", "locale": "pt-br", "text": "Escolha um espaço de melhoria vazio nesse poder. Um lugar pequeno, com espaço para algo útil.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA36.mp3"}, {"id": "BR_MA37", "cue": "merge_tutorial.heaven.help.enhancement", "source_id": "MA37", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose an enhancement that fits your power. A Focus enhancement can help it use less of your energy.", "usage": "help", "locale": "pt-br", "text": "Escolha uma melhoria compatível com seu poder. Uma melhoria Focus pode ajudar a gastar menos energia.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA37.mp3"}, {"id": "BR_MA38", "cue": "merge_tutorial.heaven.help.apply", "source_id": "MA38", "source
