_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "That looks ready. Choose Apply to place the enhancement into your power. Then let’s see what it can do.", "usage": "help", "locale": "pt-br", "text": "Parece pronto. Escolha Apply para colocar a melhoria no seu poder. Depois vamos ver o que ele consegue fazer.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA38.mp3"}, {"id": "BR_MA39", "cue": "merge_tutorial.heaven.help.origin", "source_id": "MA39", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "This choice shapes the powers you can learn. Take a moment to explore the origins, and choose the one that feels right for you.", "usage": "help", "locale": "pt-br", "text": "Essa escolha define os poderes que você pode aprender. Explore as origens com calma e escolha aquela que mais combina com você.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA39.mp3"}, {"id": "BR_MA40", "cue": "merge_tutorial.heaven.help.origin_review", "source_id": "MA40", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Take one last look before you confirm. Your origin is a permanent choice, so choose the path you truly want to follow.", "usage": "help", "locale": "pt-br", "text": "Confira uma última vez antes de confirmar. Sua origem é uma escolha permanente, então escolha o caminho que você realmente quer seguir.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/pt-br/angel/BR_MA40.mp3"}, {"id": "BR_MD01", "cue": "merge_tutorial.hell.collect_setup", "source_id": "MD01", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "So, this patch of Hell is yours. Collect the Waycoins along the glowing trail, then the gem. Even impending disaster needs a starting budget.", "usage": "main", "locale": "pt-br", "text": "Então este cantinho do Inferno é seu. Recolha as Waycoins pelo caminho brilhante e depois a gema. Até um desastre anunciado precisa de um orçamento inicial.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD01.mp3"}, {"id": "BR_MD02", "cue": "merge_tutorial.hell.collect_setup.auto", "source_id": "MD02", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "You brought a Coin Pup. Delegating already? Sensible. Let it collect the coins and gem while you practice looking like you’re in charge.", "usage": "main", "locale": "pt-br", "text": "Trouxe um Coin Pup. Já está delegando? Sensato. Deixe ele recolher as moedas e a gema enquanto você pratica essa cara de quem está no comando.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD02.mp3"}, {"id": "BR_MD03", "cue": "merge_tutorial.hell.create_five", "source_id": "MD03", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Five Earth Eggs. Use Buy Egg until you have them. Yes, eggs. Apparently that is what stands between you and utter embarrassment.", "usage": "main", "locale": "pt-br", "text": "Cinco Ovos da Terra. Use Buy Egg até conseguir todos. Sim, ovos. Aparentemente, é isso que separa você de passar uma vergonha completa.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD03.mp3"}, {"id": "BR_MD04", "cue": "merge_tutorial.hell.deploy_best", "source_id": "MD04", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Deploy Best. It puts those eggs to work on your defense line. They cannot defend much while you leave them admiring the board.", "usage": "main", "locale": "pt-br", "text": "Escolha Deploy Best. Isso põe seus ovos para trabalhar na linha de defesa. Eles não defendem muita coisa se ficarem admirando o tabuleiro.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD04.mp3"}, {"id": "BR_MD05", "cue": "merge_tutorial.hell.collect_workshop_coins", "source_id": "MD05", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Fetch a Waycoin pile. The engineer does not accept hopeful expressions as payment. I asked.", "usage": "main", "locale": "pt-br", "text": "Recolha uma pilha de Waycoins. O engenheiro não aceita olhares esperançosos como pagamento. Eu perguntei.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD05.mp3"}, {"id": "BR_MD06", "cue": "merge_tutorial.hell.talk_engineer", "source_id": "MD06", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "The engineer is waiting at the gold line. Go speak with him. A wall might compensate for that optimistic approach to survival.", "usage": "main", "locale": "pt-br", "text": "O engenheiro está esperando na linha dourada. Vá falar com ele. Uma muralha talvez compense essa sua visão tão otimista da sobrevivência.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD06.mp3"}, {"id": "BR_MD07", "cue": "merge_tutorial.hell.unlock_bulwark", "source_id": "MD07", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Unlock the Impaler Palisade. One gem buys a rather pointed objection to trespassers. Finally, a decorating choice I approve of.", "usage": "main", "locale": "pt-br", "text": "Desbloqueie Impaler Palisade. Uma gema compra uma objeção bastante pontuda aos invasores. Finalmente, uma decoração que eu aprovo.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD07.mp3"}, {"id": "BR_MD08", "cue": "merge_tutorial.hell.install_bulwark", "source_id": "MD08", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Install. Owning a wall and actually putting it in the enemy’s way are, regrettably, different things.", "usage": "main", "locale": "pt-br", "text": "Escolha Install. Ter uma muralha e realmente pôr ela no caminho do inimigo são, infelizmente, coisas diferentes.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD08.mp3"}, {"id": "BR_MD09", "cue": "merge_tutorial.hell.collect_cannon_coins", "source_id": "MD09", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Another Waycoin pile, please. Artillery is wonderfully persuasive, but apparently persuasion has installation costs.", "usage": "main", "locale": "pt-br", "text": "Outra pilha de Waycoins, por favor. Artilharia é muito convincente, mas parece que convencer alguém tem custo de instalação.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD09.mp3"}, {"id": "BR_MD10", "cue": "merge_tutorial.hell.collect_cannon_gem", "source_id": "MD10", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Collect that gem. We’re unlocking a Heal cannon. Try not to look so disappointed that it does something useful.", "usage": "main", "locale": "pt-br", "text": "Recolha aquela gema. Vamos desbloquear um canhão Heal. Tente não parecer tão decepcionado por ele fazer algo útil.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD10.mp3"}, {"id": "BR_MD11", "cue": "merge_tutorial.hell.talk_commander", "source_id": "MD11", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your artillery commander is waiting by the right-hand gun. Go introduce yourself before your defense introduces itself to the floor.", "usage": "main", "locale": "pt-br", "text": "Seu comandante de artilharia espera junto ao canhão da direita. Vá se apresentar antes que sua defesa acabe se apresentando ao chão.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD11.mp3"}, {"id": "BR_MD12", "cue": "merge_tutorial.hell.unlock_cannon", "source_id": "MD12", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Unlock Heal with your gem. Yes, healing artillery. Apparently keeping your defenders alive is part of the strategy.", "usage": "main", "locale": "pt-br", "text": "Desbloqueie Heal com sua gema. Sim, artilharia que cura. Aparentemente, manter seus defensores vivos faz parte da estratégia.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD12.mp3"}, {"id": "BR_MD13", "cue": "merge_tutorial.hell.install_cannon", "source_id": "MD13", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Install. Let the Heal cannon earn its place. Your defenders have been very patient with your management so far.", "usage": "main", "locale": "pt-br", "text": "Escolha Install. Deixe o canhão Heal merecer seu lugar. Seus defensores têm sido muito pacientes com sua gestão até agora.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD13.mp3"}, {"id": "BR_MD14", "cue": "merge_tutorial.hell.power_lesson", "source_id": "MD14", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "You’ve earned a power. Open Powers, choose one, and Commit. Magnet can collect scattered loot. Anything that reduces your wandering is progress.", "usage": "main", "locale": "pt-br", "text": "Você ganhou um poder. Abra Powers, escolha um e use Commit. Magnet recolhe o saque espalhado. Qualquer coisa que diminua suas andanças já é progresso.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD14.mp3"}, {"id": "BR_MD15", "cue": "merge_tutorial.hell.collect_upgrade_coins", "source_id": "MD15", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Gather some more Waycoins. Your eggs could use an improvement, and glaring at them has achieved remarkably little.", "usage": "main", "locale": "pt-br", "text": "Recolha mais Waycoins. Seus ovos precisam de uma melhoria, e olhar feio para eles não adiantou muita coisa.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD15.mp3"}, {"id": "BR_MD16", "cue": "merge_tutorial.hell.collect_upgrade_coins.auto", "source_id": "MD16", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Let your Coin Pup gather the funds. At least one member of this operation understands the assignment.", "usage": "main", "locale": "pt-br", "text": "Deixe seu Coin Pup reunir os fundos. Pelo menos alguém nesta operação entendeu a tarefa.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD16.mp3"}, {"id": "BR_MD17", "cue": "merge_tutorial.hell.upgrade_eggs", "source_id": "MD17", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Time to improve those eggs. Buy a couple, then use Deploy Best. Already have one waiting? Place it. I’m mocking you, not trying to trap you.", "usage": "main", "locale": "pt-br", "text": "Hora de melhorar esses ovos. Compre dois e use Deploy Best. Já tem um esperando? Coloque na linha. Estou zombando de você, não tentando prender você aqui.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD17.mp3"}, {"id": "BR_MD18", "cue": "merge_tutorial.hell.upgrade_eggs.deploy", "source_id": "MD18", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Deploy Best. It can combine matching eggs or place one on the line. Either counts. Do try to contain your relief.", "usage": "main", "locale": "pt-br", "text": "Escolha Deploy Best. Ele pode combinar ovos iguais ou colocar um na linha. Os dois contam. Tente disfarçar esse alívio.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD18.mp3"}, {"id": "BR_MD19", "cue": "merge_tutorial.hell.slots_lesson", "source_id": "MD19", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Two extra enhancement slots are yours to choose. Open Powers, place them, and Commit. You may reconsider before committing. A rare luxury.", "usage": "main", "locale": "pt-br", "text": "Você pode escolher dois espaços extras de melhoria. Abra Powers, coloque eles e use Commit. Pode mudar de ideia antes de confirmar. Um luxo raro.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD19.mp3"}, {"id": "BR_MD20", "cue": "merge_tutorial.hell.enhance_lesson", "source_id": "MD20", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Those new slots are not merely decorative. Choose a power in Powers, and fit it with an enhancement. Let’s see some improvement.", "usage": "main", "locale": "pt-br", "text": "Esses espaços novos não são apenas decorativos. Escolha um poder em Powers e coloque uma melhoria. Vamos ver algum progresso.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD20.mp3"}, {"id": "BR_MD21", "cue": "merge_tutorial.hell.talk_quartermaster", "source_id": "MD21", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "That’s Macros, your Quartermaster. Boosts, enhancements, optional training. Visit when you like. For once, I am not giving you homework.", "usage": "main", "locale": "pt-br", "text": "Esse é Macros, seu intendente. Reforços, melhorias, treinamento opcional. Visite quando quiser. Por uma vez, não estou passando dever de casa.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD21.mp3"}, {"id": "BR_MD22", "cue": "merge_tutorial.hell.after_setup", "source_id": "MD22", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Eggs in one basket? How traditional. Try filling another hatcher; two smaller squads can serve you better than one powerful egg. Your defense, your decision.", "usage": "main", "locale": "pt-br", "text": "Todos os ovos na mesma cesta? Que clássico. Experimente colocar um ovo em outra incubadora. Dois esquadrões pequenos podem ajudar mais do que um único ovo poderoso. Sua defesa, sua decisão.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD22.mp3"}, {"id": "BR_MD23", "cue": "merge_tutorial.hell.after_bulwark", "source_id": "MD23", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "A wall, installed correctly. I shall try not to sound surprised. Let the next enemies test your handiwork.", "usage": "main", "locale": "pt-br", "text": "Uma muralha instalada corretamente. Vou tentar não parecer surpreso. Deixe os próximos inimigos testarem sua obra.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD23.mp3"}, {"id": "BR_MD24", "cue": "merge_tutorial.hell.after_cannon", "source_id": "MD24", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "The Heal cannon is installed. Let’s see whether your defense survives long enough to earn its next lesson.", "usage": "main", "locale": "pt-br", "text": "O canhão Heal está instalado. Vamos ver se sua defesa sobrevive o bastante para ganhar a próxima lição.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD24.mp3"}, {"id": "BR_MD25", "cue": "merge_tutorial.hell.after_power", "source_id": "MD25", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "A power of your own. Use it when it helps. I’d hate for it to become another expensive ornament.", "usage": "main", "locale": "pt-br", "text": "Um poder só seu. Use quando ajudar. Eu detestaria ver isso virar mais um enfeite caro.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD25.mp3"}, {"id": "BR_MD26", "cue": "merge_tutorial.hell.after_upgrade", "source_id": "MD26", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "An improvement. I noticed. Your guardians may return to work while I recover from this unexpected competence.", "usage": "main", "locale": "pt-br", "text": "Uma melhoria. Eu percebi. Seus guardiões podem voltar ao trabalho enquanto me recupero dessa competência inesperada.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD26.mp3"}, {"id": "BR_MD27", "cue": "merge_tutorial.hell.after_slots", "source_id": "MD27", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your slots are ready. Hold the line a little longer, and we’ll put something useful in one of them.", "usage": "main", "locale": "pt-br", "text": "Seus espaços estão prontos. Segure a linha mais um pouco, e vamos pôr algo útil em um deles.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD27.mp3"}, {"id": "BR_MD28", "cue": "merge_tutorial.hell.after_enhance", "source_id": "MD28", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "An enhanced power. Better. Keep the defense going. You are becoming inconveniently capable.", "usage": "main", "locale": "pt-br", "text": "Um poder melhorado. Melhor assim. Continue defendendo. Você está ficando inconvenientemente capaz.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD28.mp3"}, {"id": "BR_MD29", "cue": "merge_tutorial.hell.completion", "source_id": "MD29", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "That concludes your introduction to barely controlled chaos. Keep improving your defense. Explore if you like. You may even visit Farm and Fight. I shall endure your absence.", "usage": "main", "locale": "pt-br", "text": "Isso encerra sua introdução ao caos quase controlado. Continue melhorando sua defesa. Explore se quiser. Pode até visitar Farm and Fight. Vou suportar sua ausência.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD29.mp3"}, {"id": "BR_MD30", "cue": "merge_tutorial.hell.resume", "source_id": "MD30", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Back for more? Your progress survived. Follow the guide, and we’ll resume the part you were so thoughtfully contemplating.", "usage": "main", "locale": "pt-br", "text": "Voltou para mais? Seu progresso sobreviveu. Siga a indicação, e vamos retomar aquela parte que você estava contemplando com tanto cuidado.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD30.mp3"}, {"id": "BR_MD31", "cue": "merge_tutorial.hell.reminder", "source_id": "MD31", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your next step is still waiting by the glowing guide. No rush. The enemies have only their entire existence to spare.", "usage": "reminder", "locale": "pt-br", "text": "Sua próxima tarefa continua esperando perto do caminho brilhante. Sem pressa. Os inimigos só têm a eternidade inteira pela frente.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD31.mp3"}, {"id": "BR_MD32", "cue": "merge_tutorial.hell.help.power", "source_id": "MD32", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose a power, then Commit. Magnet is useful. So, I’m told, is making a decision.", "usage": "help", "locale": "pt-br", "text": "Escolha um poder e use Commit. Magnet é útil. Tomar uma decisão também é, pelo que me contam.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD32.mp3"}, {"id": "BR_MD33", "cue": "merge_tutorial.hell.help.slots", "source_id": "MD33", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Place your extra slots on powers you own. Change your picks if you must, then Commit. Empty deliberation is not an enhancement.", "usage": "help", "locale": "pt-br", "text": "Coloque seus espaços extras em poderes que você já tem. Mude as escolhas se precisar e use Commit. Pensar sem fazer nada não é uma melhoria.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD33.mp3"}, {"id": "BR_MD34", "cue": "merge_tutorial.hell.help.commit", "source_id": "MD34", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your choices are waiting. Commit to keep them, or adjust them first. Staring at the button is not a third option.", "usage": "help", "locale": "pt-br", "text": "Suas escolhas estão esperando. Use Commit para confirmar ou ajuste primeiro. Encarar o botão não é uma terceira opção.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD34.mp3"}, {"id": "BR_MD35", "cue": "merge_tutorial.hell.help.owned", "source_id": "MD35", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose a power you own. We need somewhere to put the enhancement, preferably somewhere useful.", "usage": "help", "locale": "pt-br", "text": "Escolha um poder que você tem. Precisamos de um lugar para a melhoria, de preferência um lugar útil.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD35.mp3"}, {"id": "BR_MD36", "cue": "merge_tutorial.hell.help.slot", "source_id": "MD36", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose an empty slot on that power. Yes, the empty one. We’re filling it, not admiring it.", "usage": "help", "locale": "pt-br", "text": "Escolha um espaço vazio nesse poder. Sim, o vazio. Vamos preencher, não admirar.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD36.mp3"}, {"id": "BR_MD37", "cue": "merge_tutorial.hell.help.enhancement", "source_id": "MD37", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose a fitting enhancement. Focus reduces the energy your power spends. Efficiency. Such a refreshing concept.", "usage": "help", "locale": "pt-br", "text": "Escolha uma melhoria compatível. Focus reduz a energia que seu poder gasta. Eficiência. Que conceito refrescante.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD37.mp3"}, {"id": "BR_MD38", "cue": "merge_tutorial.hell.help.apply", "source_id": "MD38", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Apply. The enhancement does rather more inside the power than it does sitting in a menu.", "usage": "help", "locale": "pt-br", "text": "Escolha Apply. A melhoria faz bem mais dentro do poder do que parada num menu.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD38.mp3"}, {"id": "BR_MD39", "cue": "merge_tutorial.hell.help.origin", "source_id": "MD39", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choosing an origin? That shapes the powers you can learn. Read the choices. Even I would not rush you through this one.", "usage": "help", "locale": "pt-br", "text": "Escolhendo uma origem? Isso define os poderes que você pode aprender. Leia as opções. Nem eu apressaria você nessa decisão.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD39.mp3"}, {"id": "BR_MD40", "cue": "merge_tutorial.hell.help.origin_review", "source_id": "MD40", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "One last look before you confirm. Your origin is permanent. For this decision, thinking twice is entirely acceptable.", "usage": "help", "locale": "pt-br", "text": "Uma última conferida antes de confirmar. Sua origem é permanente. Para esta decisão, pensar duas vezes é perfeitamente aceitável.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/pt-br/demon/BR_MD40.mp3"}];const el=id=>document.getElementById(id);let active=null;
function play(c){active=c;el('title').textContent=c.id+' · '+c.speaker;el('caption').textContent=c.text;el('meaning').textContent=c.english_meaning;el('status').textContent='';el('player').src=c.file;el('player').play().catch(()=>{el('status').textContent='Press play to listen.'})}
function render(){const chosen=clips.filter(c=>c.locale===el('language').value&&c.track===el('track').value&&c.speaker===el('speaker').value);el('count').textContent=chosen.length+' lines · button and power names match the live menus';el('list').replaceChildren(...chosen.map(c=>{const row=document.createElement('article'),b=document.createElement('button'),body=document.createElement('div');b.textContent='▶ '+c.source_id;b.onclick=()=>play(c);b.setAttribute('aria-label','Listen to '+c.id);for(const [text,cls]of[[c.cue,'cue'],[c.text,''],[c.english_meaning,'meaning']]){const p=document.createElement('p');p.textContent=text;p.className=cls;body.append(p)}row.append(b,body);return row}))}
for(const id of ['language','track','speaker'])el(id).onchange=render;el('player').onerror=()=>el('status').textContent='This recording could not be loaded.';render();
</script></html>
