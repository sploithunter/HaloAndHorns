<main><h1>Angel & Demon: complete localized tutorials</h1><p>344 recordings · Farm & Fight and Merge · approved voices and performance settings.<br>These are original recordings. The game applies its existing character gains and Voices Volume setting.</p>
<label>Language<select id="language"><option value="es">Español</option><option value="pt-br">Português (Brasil)</option></select></label><label>Game<select id="track"><option value="farm">Farm & Fight</option><option value="merge">Merge</option></select></label><label>Character<select id="speaker"><option value="angel">Angel</option><option value="demon">Demon</option></select></label>

const clips=[{"id": "ES_A01", "cue": "tutorial.hatch_first_egg", "source_id": "A01", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Your companion could use a friend. Follow the trail to the Earth Egg, and let’s wake one.", "usage": "main", "locale": "es", "text": "A tu compañero le vendría bien un amigo. Sigue el camino hasta el Huevo de Tierra, y vamos a despertar a uno.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A01.mp3"}, {"id": "ES_A02", "cue": "tutorial.farm_crystals", "source_id": "A02", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "See those crystals? With Farm Near on, your pets will mine beside you. Help them along, and we’ll soon have coins for another friend.", "usage": "main", "locale": "es", "text": "¿Ves esos cristales? Con Farm Near activado, tus mascotas minarán a tu lado. Ayúdalas un poquito, y pronto tendremos monedas para otro amigo.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A02.mp3"}, {"id": "ES_A03", "cue": "tutorial.hatch_another", "source_id": "A03", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "You’ve earned another egg. Shall we see who’s waiting inside? Every new friend gives your little squad more strength.", "usage": "main", "locale": "es", "text": "Ya ganaste otro huevo. ¿Vemos quién nos espera dentro? Cada nuevo amigo le da más fuerza a tu pequeño escuadrón.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A03.mp3"}, {"id": "ES_A04", "cue": "tutorial.build_squad", "source_id": "A04", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "I’ve left a Rainbow Kitty in your inventory. Open Pets, and let’s make room for that bright little spark on your squad.", "usage": "main", "locale": "es", "text": "Dejé un Gatito Arcoíris en tu inventario. Abre Pets, y vamos a hacerle un lugar en tu escuadrón a esa pequeña chispa.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A04.mp3"}, {"id": "ES_A05", "cue": "tutorial.bind_power", "source_id": "A05", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There’s a gift within you, too. It’s called Resonance. Open Edit on your power bar, and give it a place where you can reach it.", "usage": "main", "locale": "es", "text": "Tú también llevas un don dentro. Se llama Resonance. Abre Edit en tu barra de poderes y dale un lugar donde lo tengas a mano.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A05.mp3"}, {"id": "ES_A06", "cue": "tutorial.cast_power", "source_id": "A06", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Now, try Resonance near the crystals. Feel that? Your power helps them break faster and yield a little more.", "usage": "main", "locale": "es", "text": "Ahora prueba Resonance cerca de los cristales. ¿Lo sientes? Tu poder ayuda a romperlos más rápido y a obtener un poquito más.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A06.mp3"}, {"id": "ES_A07", "cue": "tutorial.slot_power", "source_id": "A07", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "A little Potency will make that gift stronger. Open Powers, and let’s add your new enhancement to Resonance.", "usage": "main", "locale": "es", "text": "Un poco de Potency hará más fuerte ese don. Abre Powers, y añadamos tu nueva mejora a Resonance.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A07.mp3"}, {"id": "ES_A08", "cue": "tutorial.first_fight", "source_id": "A08", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "The Earth cave is a place to practice fighting. Follow the trail when you’re ready. Its instructor has rather more horns than patience.", "usage": "main", "locale": "es", "text": "La cueva de Tierra es un lugar para practicar combate. Sigue el camino cuando estés listo. Su instructor tiene bastantes más cuernos que paciencia.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A08.mp3"}, {"id": "ES_A09", "cue": "tutorial.rally_call", "source_id": "A09", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "A good leader knows when to call everyone home. Try Rally—the flag on your power bar—and bring your pets back to your side.", "usage": "main", "locale": "es", "text": "Un buen líder sabe cuándo reunir a todos. Prueba Rally, la bandera de tu barra de poderes, y llama a tus mascotas a tu lado.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A09.mp3"}, {"id": "ES_A10", "cue": "tutorial.completion", "source_id": "A10", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Look how far you’ve come. The Ascension Altar is ready for you. Choose your next power, then follow your missions. There’s a whole world waiting.", "usage": "main", "locale": "es", "text": "Mira cuánto has avanzado. El Altar de Ascensión te espera. Elige tu próximo poder y sigue tus misiones. Hay todo un mundo por descubrir.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A10.mp3"}, {"id": "ES_A11", "cue": "tutorial.build_squad.guide.unequip", "source_id": "A11", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Your active squad is full. Let one pet rest in your inventory, and we can welcome the Kitty.", "usage": "help", "locale": "es", "text": "Tu escuadrón activo está lleno. Deja que una mascota descanse en tu inventario, y podremos darle la bienvenida al Gatito.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A11.mp3"}, {"id": "ES_A12", "cue": "tutorial.build_squad.guide.pick", "source_id": "A12", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There’s your Rainbow Kitty. Choose that little one for the open place on your squad.", "usage": "help", "locale": "es", "text": "Ahí está tu Gatito Arcoíris. Elígelo para ocupar el lugar libre de tu escuadrón.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A12.mp3"}, {"id": "ES_A13", "cue": "tutorial.build_squad.guide.activate", "source_id": "A13", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "They’re ready. Choose Activate, and your new squad will join you.", "usage": "help", "locale": "es", "text": "Ya están listos. Elige Activate, y tu nuevo escuadrón se reunirá contigo.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A13.mp3"}, {"id": "ES_A14", "cue": "tutorial.bind_power.choose", "source_id": "A14", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Resonance and an open place on your power bar. Put it wherever feels right to you.", "usage": "help", "locale": "es", "text": "Elige Resonance y un lugar libre en tu barra de poderes. Ponlo donde te resulte más cómodo.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A14.mp3"}, {"id": "ES_A15", "cue": "tutorial.bind_power.done", "source_id": "A15", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There it is. Choose Done to finish setting your power bar.", "usage": "help", "locale": "es", "text": "Ahí está. Elige Done para terminar de organizar tu barra de poderes.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A15.mp3"}, {"id": "ES_A16", "cue": "tutorial.slot_power.pick_power", "source_id": "A16", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Resonance. That’s the power we’re making stronger.", "usage": "help", "locale": "es", "text": "Elige Resonance. Ese es el poder que vamos a fortalecer.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A16.mp3"}, {"id": "ES_A17", "cue": "tutorial.slot_power.pick_slot", "source_id": "A17", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "An empty enhancement slot is a little room to grow. Choose one on Resonance.", "usage": "help", "locale": "es", "text": "Una ranura de mejora vacía es un pequeño espacio para crecer. Elige una en Resonance.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A17.mp3"}, {"id": "ES_A18", "cue": "tutorial.slot_power.pick_enhancement", "source_id": "A18", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Potency. It gives your crystal-boosting pulse a little more strength.", "usage": "help", "locale": "es", "text": "Elige Potency. Le dará un poquito más de fuerza al pulso que potencia tus cristales.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A18.mp3"}, {"id": "ES_A19", "cue": "tutorial.slot_power.apply", "source_id": "A19", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Apply, and that extra strength becomes yours.", "usage": "help", "locale": "es", "text": "Elige Apply, y esa fuerza extra será tuya.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A19.mp3"}, {"id": "ES_A20", "cue": "tutorial.farm_crystals.reminder", "source_id": "A20", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Try a small crystal nearby. Keep Farm Near on, and let your squad earn the coins together.", "usage": "help", "locale": "es", "text": "Prueba con un cristal pequeño cercano. Mantén Farm Near activado y deja que tu escuadrón gane las monedas en equipo.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A20.mp3"}, {"id": "ES_A21", "cue": "tutorial.cast_power.reminder", "source_id": "A21", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Bring your squad close to the crystals before you use Resonance. That’s where its gift can help.", "usage": "help", "locale": "es", "text": "Acerca tu escuadrón a los cristales antes de usar Resonance. Ahí es donde su don puede ayudar.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A21.mp3"}, {"id": "ES_A22", "cue": "tutorial.first_fight.handoff", "source_id": "A22", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Of course. Training will be waiting in Quest whenever you’re ready. You can return to the Earth cave then.", "usage": "conditional", "locale": "es", "text": "Claro que sí. El entrenamiento te esperará en Quest cuando estés listo. Entonces podrás volver a la cueva de Tierra.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A22.mp3"}, {"id": "ES_A23", "cue": "tutorial.resume", "source_id": "A23", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Welcome back, little light. We’ll carry on from where you left off. Follow your current lesson when you’re ready.", "usage": "conditional", "locale": "es", "text": "Bienvenido de nuevo, pequeña luz. Seguiremos donde lo dejaste. Continúa con tu lección actual cuando estés listo.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A23.mp3"}, {"id": "ES_A24", "cue": "tutorial.basic_return", "source_id": "A24", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Welcome back. I hope he remembered his manners. You’ve learned to look after your squad—and that matters far more than looking fearless.", "usage": "conditional", "locale": "es", "text": "Bienvenido de nuevo. Espero que haya recordado sus buenos modales. Aprendiste a cuidar de tu escuadrón, y eso vale mucho más que parecer valiente.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A24.mp3"}, {"id": "ES_A25", "cue": "tutorial.choose_companion", "source_id": "A25", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There you are, little light. Let’s choose your first companion. A bunny, a bear, a doggy, or a kitty — who will join you on your adventure?", "usage": "conditional", "locale": "es", "text": "Ahí estás, pequeña luz. Vamos a elegir a tu primer compañero. Un conejito, un osito, un perrito o un gatito... ¿quién te acompañará en esta aventura?", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A25.mp3"}, {"id": "ES_A26", "cue": "tutorial.hatch_first_egg.reminder", "source_id": "A26", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Your next little friend is waiting. Follow the glowing trail to the Earth Egg, and choose Hatch. I’ll be right here.", "usage": "reminder", "locale": "es", "text": "Tu próximo amiguito te está esperando. Sigue el camino brillante hasta el Huevo de Tierra y abre uno. Yo estaré aquí.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A26.mp3"}, {"id": "ES_A27", "cue": "tutorial.next_task.reminder", "source_id": "A27", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Take your time, little light. When you’re ready, follow the glowing guide and try the next step. I know you can do it.", "usage": "reminder", "locale": "es", "text": "Sin prisa, pequeña luz. Cuando estés listo, sigue la guía brillante e intenta el siguiente paso. Sé que puedes hacerlo.", "speaker": "angel", "track": "farm", "file": "../tutorial_localized/es/angel/ES_A27.mp3"}, {"id": "ES_D01", "cue": "combat_tutorial.ready", "source_id": "D01", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "So. The angel sent me another promising little soul. Choose Enter on that frost door. I’ve found you something suitably unimpressive to fight.", "usage": "main", "locale": "es", "text": "Vaya. El ángel me envió otra pequeña alma prometedora. Elige Enter en esa puerta helada. Te encontré un rival convenientemente poco impresionante.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D01.mp3"}, {"id": "ES_D02", "cue": "combat_tutorial.first_fight", "source_id": "D02", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There’s your opponent. Get close and let your pets do the fighting. Yes, they do most of the work. Try to look involved.", "usage": "main", "locale": "es", "text": "Ahí está tu oponente. Acércate y deja que tus mascotas peleen. Sí, ellas hacen casi todo. Intenta parecer ocupado.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D02.mp3"}, {"id": "ES_D03", "cue": "combat_tutorial.advance_stage", "source_id": "D03", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "One training dog defeated. Terrifying. The glowing pillar takes you back to the lobby. We’ll see if that was luck.", "usage": "main", "locale": "es", "text": "Un perro de entrenamiento derrotado. Aterrador. El pilar brillante te devuelve al vestíbulo. Veremos si fue suerte.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D03.mp3"}, {"id": "ES_D04", "cue": "combat_tutorial.battle_brew", "source_id": "D04", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Berserk Brew. A little borrowed ferocity for your pets. Take a sip from your power bar. This is the safe room, after all.", "usage": "main", "locale": "es", "text": "Berserk Brew. Un poco de ferocidad prestada para tus mascotas. Toma un sorbo desde tu barra de poderes. Después de todo, esta es la sala segura.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D04.mp3"}, {"id": "ES_D05", "cue": "combat_tutorial.ready_brew", "source_id": "D05", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Feeling fierce? Enter the arena. Let’s find out whether your pets agree.", "usage": "main", "locale": "es", "text": "¿Te sientes feroz? Entra en la arena. Veamos si tus mascotas están de acuerdo.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D05.mp3"}, {"id": "ES_D06", "cue": "combat_tutorial.brew_fight", "source_id": "D06", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Notice the harder hits? That’s the brew. Finish this one before you start taking all the credit.", "usage": "main", "locale": "es", "text": "¿Notas esos golpes más fuertes? Es la bebida. Termina con este antes de atribuirte todo el mérito.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D06.mp3"}, {"id": "ES_D07", "cue": "combat_tutorial.advance_brew", "source_id": "D07", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Better. The pillar will bring you back. Next, we address your squad’s regrettable habit of getting hurt.", "usage": "main", "locale": "es", "text": "Mejor. El pilar te traerá de vuelta. Ahora trataremos esa lamentable costumbre de tu escuadrón de salir herido.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D07.mp3"}, {"id": "ES_D08", "cue": "combat_tutorial.bind_heal", "source_id": "D08", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "You have Heal. How inconvenient for me. Open Edit, put it on your power bar, and finish with Done.", "usage": "main", "locale": "es", "text": "Tienes Heal. Qué inconveniente para mí. Abre Edit, ponlo en tu barra de poderes y termina con Done.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D08.mp3"}, {"id": "ES_D09", "cue": "combat_tutorial.enhance_heal", "source_id": "D09", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Let’s make Heal worth using. Open Powers and give it the Healing enhancement I provided. I prefer my opponents properly prepared.", "usage": "main", "locale": "es", "text": "Hagamos que Heal valga la pena. Abre Powers y añade la mejora Healing que te di. Prefiero oponentes bien preparados.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D09.mp3"}, {"id": "ES_D10", "cue": "combat_tutorial.ready_heal", "source_id": "D10", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Your healing lesson awaits. Enter the arena—and do pay attention to your pets this time.", "usage": "main", "locale": "es", "text": "Tu lección de curación te espera. Entra en la arena, y esta vez presta atención a tus mascotas.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D10.mp3"}, {"id": "ES_D11", "cue": "combat_tutorial.select_pet", "source_id": "D11", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "That yellow health bar belongs to your wounded pet. Select its card. Admiring the problem won’t mend it.", "usage": "main", "locale": "es", "text": "Esa barra de salud amarilla es de tu mascota herida. Selecciona su tarjeta. Admirar el problema no va a curarla.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D11.mp3"}, {"id": "ES_D12", "cue": "combat_tutorial.cast_heal", "source_id": "D12", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Now use Heal on the pet you selected. Once it recovers, those enemy shields come down. Consider that your warning.", "usage": "main", "locale": "es", "text": "Ahora usa Heal en la mascota que seleccionaste. Cuando se recupere, caerán los escudos enemigos. Considéralo una advertencia.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D12.mp3"}, {"id": "ES_D13", "cue": "combat_tutorial.heal_fight", "source_id": "D13", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Shields down. Finish both training dogs. The exit pillar is for winners, little hero.", "usage": "main", "locale": "es", "text": "Escudos abajo. Acaba con los dos perros de entrenamiento. El pilar de salida es para los ganadores, pequeño héroe.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D13.mp3"}, {"id": "ES_D14", "cue": "combat_tutorial.advance_heal", "source_id": "D14", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "The room is clear. Use the glowing pillar to finish Basic Training. You’ve become slightly less likely to embarrass yourself.", "usage": "main", "locale": "es", "text": "La sala está despejada. Usa el pilar brillante para terminar el entrenamiento básico. Ahora es un poco menos probable que hagas el ridículo.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D14.mp3"}, {"id": "ES_D15", "cue": "combat_tutorial.ready_weaken", "source_id": "D15", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Back for more? How irritatingly diligent. I’ve given you Weakening Vials. Enter the arena, and we’ll spoil someone’s defenses.", "usage": "main", "locale": "es", "text": "¿Volviste por más? Qué dedicación tan irritante. Te di Weakening Vials. Entra en la arena, y arruinaremos unas cuantas defensas.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D15.mp3"}, {"id": "ES_D16", "cue": "combat_tutorial.select_enemy", "source_id": "D16", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose the marked enemy’s card. The vial needs a target. Throwing it at your own feet would make a very short lesson.", "usage": "main", "locale": "es", "text": "Elige la tarjeta del enemigo marcado. El frasco necesita un objetivo. Tirártelo a los pies haría esta lección muy breve.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D16.mp3"}, {"id": "ES_D17", "cue": "combat_tutorial.throw_weaken", "source_id": "D17", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Throw the Weakening Vial at your target. Down come the shields. Then you can get on with the unpleasant business of winning.", "usage": "main", "locale": "es", "text": "Lanza el Weakening Vial contra tu objetivo. Abajo los escudos. Después podrás dedicarte al desagradable asunto de ganar.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D17.mp3"}, {"id": "ES_D18", "cue": "combat_tutorial.weaken_fight", "source_id": "D18", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Their shields are gone. Defeat both dogs. No, the pillar won’t rescue you from unfinished work.", "usage": "main", "locale": "es", "text": "Ya no tienen escudos. Derrota a los dos perros. No, el pilar no te rescatará del trabajo pendiente.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D18.mp3"}, {"id": "ES_D19", "cue": "combat_tutorial.advance_weaken", "source_id": "D19", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "You found a weakness and used it. Almost devious. Take the pillar back to the lobby.", "usage": "main", "locale": "es", "text": "Encontraste una debilidad y la aprovechaste. Casi astuto. Usa el pilar para volver al vestíbulo.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D19.mp3"}, {"id": "ES_D20", "cue": "combat_tutorial.stack_brew", "source_id": "D20", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "More Berserk Brew means bigger hits, not a longer timer. Drink five sips. We’re building a damage meter, not a collection.", "usage": "main", "locale": "es", "text": "Más Berserk Brew significa golpes más fuertes, no más tiempo. Toma cinco sorbos. Estamos llenando un medidor de daño, no haciendo una colección.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D20.mp3"}, {"id": "ES_D21", "cue": "combat_tutorial.ready_stack", "source_id": "D21", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There. A proper dose of trouble. Enter the arena while that damage meter has something left to give.", "usage": "main", "locale": "es", "text": "Eso es. Una buena dosis de problemas. Entra en la arena mientras a ese medidor de daño le quede algo que ofrecer.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D21.mp3"}, {"id": "ES_D22", "cue": "combat_tutorial.stack_fight", "source_id": "D22", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Now watch those hits. Much more convincing. Finish the dog before your borrowed courage wears off.", "usage": "main", "locale": "es", "text": "Ahora mira esos golpes. Mucho más convincentes. Acaba con el perro antes de que se te pase el valor prestado.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D22.mp3"}, {"id": "ES_D23", "cue": "combat_tutorial.advance_stack", "source_id": "D23", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "That was almost efficient. The glowing pillar finishes this course. I suppose you’ll want your reward.", "usage": "main", "locale": "es", "text": "Eso fue casi eficiente. El pilar brillante termina este curso. Supongo que querrás tu recompensa.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D23.mp3"}, {"id": "ES_D24", "cue": "combat_tutorial.ready_tank", "source_id": "D24", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Let’s put something sturdier between your squad and disaster. Open Pets. One doggy is making room for a bear.", "usage": "main", "locale": "es", "text": "Pongamos algo más resistente entre tu escuadrón y el desastre. Abre Pets. Un perrito le hará lugar a un oso.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D24.mp3"}, {"id": "ES_D25", "cue": "combat_tutorial.tank_fight", "source_id": "D25", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "The tank draws attention and takes the punishment. It hits less hard, but your other pets get to keep their dignity—and their health. Finish the fight.", "usage": "main", "locale": "es", "text": "El tanque atrae la atención y aguanta los golpes. Pega menos fuerte, pero tus otras mascotas conservan su dignidad y su salud. Termina la pelea.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D25.mp3"}, {"id": "ES_D26", "cue": "combat_tutorial.advance_tank", "source_id": "D26", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Still standing. How tiresome. Take the pillar back; your next opponents have learned a little trick.", "usage": "main", "locale": "es", "text": "Sigues en pie. Qué agotador. Vuelve por el pilar; tus próximos oponentes aprendieron un truquito.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D26.mp3"}, {"id": "ES_D27", "cue": "combat_tutorial.ready_healer", "source_id": "D27", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "The next pack brought a healer. Leave it alone and it will keep repairing your hard work. Enter when you’ve grasped the problem.", "usage": "main", "locale": "es", "text": "El próximo grupo trajo un sanador. Déjalo tranquilo y seguirá reparando todo tu esfuerzo. Entra cuando hayas entendido el problema.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D27.mp3"}, {"id": "ES_D28", "cue": "combat_tutorial.healer_hunt", "source_id": "D28", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "That green healing mark is your clue. Send your pets after the healer first. I’d rather you didn’t, which should tell you everything.", "usage": "main", "locale": "es", "text": "La marca verde de curación es tu pista. Envía primero a tus mascotas contra el sanador. Preferiría que no lo hicieras, y eso debería decirte todo.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D28.mp3"}, {"id": "ES_D29", "cue": "combat_tutorial.healer_fight", "source_id": "D29", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Healer down. Now finish the rest of the pack. They’re suddenly much less optimistic.", "usage": "main", "locale": "es", "text": "Cayó el sanador. Ahora acaba con el resto del grupo. De pronto se les fue el optimismo.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D29.mp3"}, {"id": "ES_D30", "cue": "combat_tutorial.advance_healer", "source_id": "D30", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "There. No one left to patch them up. Back through the pillar. One last room, and I stop holding your hand.", "usage": "main", "locale": "es", "text": "Listo. Ya no queda nadie que los cure. Vuelve por el pilar. Una última sala, y dejo de llevarte de la mano.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D30.mp3"}, {"id": "ES_D31", "cue": "combat_tutorial.ready_together", "source_id": "D31", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Final room. Two dogs, one healer, and no helpful arrows. You have the tools. Enter when you’re ready to make me regret teaching you.", "usage": "main", "locale": "es", "text": "Última sala. Dos perros, un sanador y ninguna flecha de ayuda. Tienes las herramientas. Entra cuando estés listo para hacerme lamentar haberte enseñado.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D31.mp3"}, {"id": "ES_D32", "cue": "combat_tutorial.together_fight", "source_id": "D32", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "All yours, little hero. Clear the room. Let’s see what you remember when I stop telling you.", "usage": "main", "locale": "es", "text": "Todo tuyo, pequeño héroe. Despeja la sala. Veamos qué recuerdas cuando dejo de darte instrucciones.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D32.mp3"}, {"id": "ES_D33", "cue": "combat_tutorial.advance_together", "source_id": "D33", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "No arrows, and you still managed it. Deeply inconvenient. Take the glowing pillar and finish your training.", "usage": "main", "locale": "es", "text": "Sin flechas, y aun así lo lograste. Terriblemente inconveniente. Usa el pilar brillante y termina tu entrenamiento.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D33.mp3"}, {"id": "ES_D34", "cue": "combat_courses.basic.completion", "source_id": "D34", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Basic Training, complete. Your pets and powers are ready for the world. Advanced lessons are optional. I’m sure you’ll miss my encouragement.", "usage": "completion", "locale": "es", "text": "Entrenamiento básico completado. Tus mascotas y poderes están listos para el mundo. Las lecciones avanzadas son opcionales. Seguro extrañarás mis palabras de ánimo.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D34.mp3"}, {"id": "ES_D35", "cue": "combat_courses.advanced_1.completion", "source_id": "D35", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Advanced One, complete. You’ve earned a Double XP token. Use it from your inventory when you want the extra experience. Do try to make it count.", "usage": "completion", "locale": "es", "text": "Avanzado uno, completado. Ganaste una ficha de experiencia doble. Úsala desde tu inventario cuando quieras experiencia extra. Procura aprovecharla.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D35.mp3"}, {"id": "ES_D36", "cue": "combat_courses.advanced_2.completion", "source_id": "D36", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "All courses complete. There’s a Double Coins token waiting in your inventory. Use it when you’re ready. You’ve become a rather troublesome little hero.", "usage": "completion", "locale": "es", "text": "Todos los cursos completados. Te espera una ficha de monedas dobles en tu inventario. Úsala cuando quieras. Te has vuelto un pequeño héroe bastante problemático.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D36.mp3"}, {"id": "ES_D37", "cue": "combat_tutorial.bind_heal.choose", "source_id": "D37", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Heal, then give it a place on your power bar. Ideally somewhere you’ll remember when things start biting.", "usage": "help", "locale": "es", "text": "Elige Heal y dale un lugar en tu barra de poderes. Preferiblemente uno que recuerdes cuando empiecen los mordiscos.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D37.mp3"}, {"id": "ES_D38", "cue": "combat_tutorial.bind_heal.done", "source_id": "D38", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Now choose Done. You can admire your arrangement after you survive.", "usage": "help", "locale": "es", "text": "Ahora elige Done. Podrás admirar tu distribución cuando sobrevivas.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D38.mp3"}, {"id": "ES_D39", "cue": "combat_tutorial.enhance_heal.pick_power", "source_id": "D39", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Heal. We’re improving that power, not browsing for something prettier.", "usage": "help", "locale": "es", "text": "Elige Heal. Estamos mejorando ese poder, no buscando algo más bonito.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D39.mp3"}, {"id": "ES_D40", "cue": "combat_tutorial.enhance_heal.pick_slot", "source_id": "D40", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose an empty slot on Heal. Even your good intentions need somewhere to go.", "usage": "help", "locale": "es", "text": "Elige una ranura vacía en Heal. Hasta tus buenas intenciones necesitan un lugar.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D40.mp3"}, {"id": "ES_D41", "cue": "combat_tutorial.enhance_heal.pick_enhancement", "source_id": "D41", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Healing. The name is a subtle clue.", "usage": "help", "locale": "es", "text": "Elige Healing. El nombre es una pista bastante sutil.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D41.mp3"}, {"id": "ES_D42", "cue": "combat_tutorial.enhance_heal.apply", "source_id": "D42", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Apply it. A staged enhancement is doing precisely nothing for you.", "usage": "help", "locale": "es", "text": "Usa Apply. Una mejora que aún no aplicaste no te está ayudando en absoluto.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D42.mp3"}, {"id": "ES_D43", "cue": "combat_tutorial.ready_tank.guide.unequip", "source_id": "D43", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Take a doggy off your active squad. The bear needs a place, not an invitation to an already full party.", "usage": "help", "locale": "es", "text": "Quita un perrito de tu escuadrón activo. El oso necesita un lugar, no una invitación a una fiesta que ya está llena.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D43.mp3"}, {"id": "ES_D44", "cue": "combat_tutorial.ready_tank.guide.pick", "source_id": "D44", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose your strongest bear. The Tank option in Best Pets can find it for you, if counting muscles proves difficult.", "usage": "help", "locale": "es", "text": "Elige a tu oso más fuerte. La opción Tank en Best Pets puede encontrarlo por ti, si contar músculos resulta complicado.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D44.mp3"}, {"id": "ES_D45", "cue": "combat_tutorial.ready_tank.guide.activate", "source_id": "D45", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Activate. I need the bear in the fight, not posing in your inventory.", "usage": "help", "locale": "es", "text": "Elige Activate. Necesito al oso en la pelea, no posando en tu inventario.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D45.mp3"}, {"id": "ES_D46", "cue": "combat_tutorial.ready_tank.guide.close", "source_id": "D46", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "The bear is on your squad. Close Pets so we can get on with it.", "usage": "help", "locale": "es", "text": "El oso ya está en tu escuadrón. Cierra Pets para que podamos continuar.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D46.mp3"}, {"id": "ES_D47", "cue": "combat_tutorial.ready_tank.guide.enter", "source_id": "D47", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Your tank is ready. Enter the arena and let it earn its place.", "usage": "help", "locale": "es", "text": "Tu tanque está listo. Entra en la arena y deja que se gane su lugar.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D47.mp3"}, {"id": "ES_D48", "cue": "combat_courses.menu", "source_id": "D48", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Basic first. Then, if you insist on improving, two advanced courses await. Choose your lesson, little hero.", "usage": "conditional", "locale": "es", "text": "Primero el básico. Después, si insistes en mejorar, te esperan dos cursos avanzados. Elige tu lección, pequeño héroe.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D48.mp3"}, {"id": "ES_D49", "cue": "combat_courses.locked", "source_id": "D49", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Finish the earlier course first. Skipping the lesson is not the same as mastering it.", "usage": "conditional", "locale": "es", "text": "Termina primero el curso anterior. Saltarse la lección no es lo mismo que dominarla.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D49.mp3"}, {"id": "ES_D50", "cue": "combat_courses.replay.start", "source_id": "D50", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "A repeat performance? Very well. The practice is yours; the first-time reward stays first-time.", "usage": "conditional", "locale": "es", "text": "¿Otra función? Muy bien. La práctica es tuya; la recompensa de primera vez sigue siendo de primera vez.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D50.mp3"}, {"id": "ES_D51", "cue": "combat_courses.replay.completion", "source_id": "D51", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Finished again. No second reward, of course. Surely my company was compensation enough.", "usage": "conditional", "locale": "es", "text": "Terminado otra vez. Sin segunda recompensa, por supuesto. Seguro que mi compañía fue compensación suficiente.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D51.mp3"}, {"id": "ES_D52", "cue": "combat_tutorial.leave_confirm", "source_id": "D52", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Leaving already? Your progress is saved. Come back when you’re ready to disappoint me properly.", "usage": "conditional", "locale": "es", "text": "¿Ya te vas? Tu progreso está guardado. Vuelve cuando estés listo para decepcionarme como se debe.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D52.mp3"}, {"id": "ES_D53", "cue": "combat_tutorial.resume", "source_id": "D53", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Back, are you? Your completed lessons still count. We’ll prepare this round again before you enter.", "usage": "conditional", "locale": "es", "text": "¿Volviste? Tus lecciones completadas siguen contando. Prepararemos esta ronda otra vez antes de que entres.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D53.mp3"}, {"id": "ES_D54", "cue": "combat_tutorial.door.pets_equipped", "source_id": "D54", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Bring at least one pet. This is combat training, not an audition for the role of bait.", "usage": "conditional", "locale": "es", "text": "Trae al menos una mascota. Esto es entrenamiento de combate, no una audición para el papel de carnada.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D54.mp3"}, {"id": "ES_D55", "cue": "combat_tutorial.door.hotbar_not_editing", "source_id": "D55", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Choose Done on your power bar first. I prefer my opponents assembled before the fight.", "usage": "conditional", "locale": "es", "text": "Elige Done en tu barra de poderes primero. Prefiero a mis oponentes bien organizados antes de pelear.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D55.mp3"}, {"id": "ES_D56", "cue": "combat_tutorial.door.heal_unbound", "source_id": "D56", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Heal belongs on your power bar. Put it there before asking that door to open.", "usage": "conditional", "locale": "es", "text": "Heal debe estar en tu barra de poderes. Ponlo ahí antes de pedir que se abra esa puerta.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D56.mp3"}, {"id": "ES_D57", "cue": "combat_tutorial.door.heal_unenhanced", "source_id": "D57", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Add Healing to Heal and apply it. Then we can discuss opening the door.", "usage": "conditional", "locale": "es", "text": "Añade Healing a Heal y usa Apply. Después hablaremos de abrir la puerta.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D57.mp3"}, {"id": "ES_D58", "cue": "combat_tutorial.door.brew_unused", "source_id": "D58", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "The Berserk Brew is for drinking. One sip, little hero. Then you may enter.", "usage": "conditional", "locale": "es", "text": "El Berserk Brew es para beber. Un sorbo, pequeño héroe. Después puedes entrar.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D58.mp3"}, {"id": "ES_D59", "cue": "combat_tutorial.door.tank_missing", "source_id": "D59", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "A bear on your active squad, please. Owning a tank is not the same as bringing one.", "usage": "conditional", "locale": "es", "text": "Un oso en tu escuadrón activo, por favor. Tener un tanque no es lo mismo que traerlo.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D59.mp3"}, {"id": "ES_D60", "cue": "combat_tutorial.stack_brew.remaining_4", "source_id": "D60", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Four more sips. That meter isn’t filling itself.", "usage": "conditional", "locale": "es", "text": "Cuatro sorbos más. Ese medidor no se va a llenar solo.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D60.mp3"}, {"id": "ES_D61", "cue": "combat_tutorial.stack_brew.remaining_3", "source_id": "D61", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Three more. I admire your commitment to doing this slowly.", "usage": "conditional", "locale": "es", "text": "Tres más. Admiro tu empeño en hacer esto despacio.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D61.mp3"}, {"id": "ES_D62", "cue": "combat_tutorial.stack_brew.remaining_2", "source_id": "D62", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Two more sips. Even I can see you’re nearly there.", "usage": "conditional", "locale": "es", "text": "Dos sorbos más. Hasta yo veo que ya casi llegas.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D62.mp3"}, {"id": "ES_D63", "cue": "combat_tutorial.stack_brew.remaining_1", "source_id": "D63", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "One more. Let’s not lose our nerve at the finish.", "usage": "conditional", "locale": "es", "text": "Uno más. No perdamos el valor justo al final.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D63.mp3"}, {"id": "ES_D64", "cue": "combat_tutorial.healer_hunt.lost", "source_id": "D64", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Your pets have wandered off the healer. Select it again. We were so close to having a strategy.", "usage": "conditional", "locale": "es", "text": "Tus mascotas se alejaron del sanador. Selecciónalo otra vez. Estuvimos tan cerca de tener una estrategia.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D64.mp3"}, {"id": "ES_D65", "cue": "combat_tutorial.next_task.reminder", "source_id": "D65", "source_catalog": "configs/tutorial_voice_lines.lua", "english_meaning": "Admiring the scenery? Charming. Your next lesson is waiting. Follow the guide when you’re ready, little hero.", "usage": "reminder", "locale": "es", "text": "¿Admirando el paisaje? Encantador. Tu próxima lección te espera. Sigue la guía cuando estés listo, pequeño héroe.", "speaker": "demon", "track": "farm", "file": "../tutorial_localized/es/demon/ES_D65.mp3"}, {"id": "ES_MA01", "cue": "merge_tutorial.heaven.collect_setup", "source_id": "MA01", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Welcome to your little corner of Heaven. Follow the glowing trail to gather the Waycoins, then the gem. We’ll turn them into a brave little defense.", "usage": "main", "locale": "es", "text": "Bienvenido a tu rinconcito del Cielo. Sigue el camino brillante para recoger las Waycoins y después la gema. Las convertiremos en una pequeña defensa valiente.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA01.mp3"}, {"id": "ES_MA02", "cue": "merge_tutorial.heaven.collect_setup.auto", "source_id": "MA02", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your Coin Pup is already gathering our supplies. Let that helpful little nose collect the coins and gem; then we’ll put them to good use.", "usage": "main", "locale": "es", "text": "Tu Coin Pup ya está reuniendo los suministros. Deja que ese pequeño ayudante recoja las monedas y la gema; después les daremos buen uso.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA02.mp3"}, {"id": "ES_MA03", "cue": "merge_tutorial.heaven.create_five", "source_id": "MA03", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Now, let’s build your first defense. Use Buy Egg to create five Earth Eggs. There’s a whole little squad waiting to begin.", "usage": "main", "locale": "es", "text": "Ahora preparemos tu primera defensa. Usa Buy Egg para crear cinco Huevos de Tierra. Todo un pequeño escuadrón está esperando para empezar.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA03.mp3"}, {"id": "ES_MA04", "cue": "merge_tutorial.heaven.deploy_best", "source_id": "MA04", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Lovely. Choose Deploy Best, and your eggs will take their places on the defense line. Your little guardians can handle the first arrivals.", "usage": "main", "locale": "es", "text": "Qué bien. Elige Deploy Best, y tus huevos ocuparán su lugar en la línea de defensa. Tus pequeños guardianes pueden encargarse de los primeros visitantes.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA04.mp3"}, {"id": "ES_MA05", "cue": "merge_tutorial.heaven.collect_workshop_coins", "source_id": "MA05", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Before we strengthen the line, gather a Waycoin pile. The engineer needs a little funding to bring his work to life.", "usage": "main", "locale": "es", "text": "Antes de fortalecer la línea, recoge un montón de Waycoins. El ingeniero necesita un poquito de ayuda para poner en marcha su trabajo.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA05.mp3"}, {"id": "ES_MA06", "cue": "merge_tutorial.heaven.talk_engineer", "source_id": "MA06", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Our engineer has arrived at the gold line. Follow the guide and speak with him. A sturdy defense can give every guardian a little more time.", "usage": "main", "locale": "es", "text": "Nuestro ingeniero llegó a la línea dorada. Sigue la guía y habla con él. Una defensa resistente puede darles un poquito más de tiempo a tus guardianes.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA06.mp3"}, {"id": "ES_MA07", "cue": "merge_tutorial.heaven.unlock_bulwark", "source_id": "MA07", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Unlock the Impaler Palisade with your gem. Those sharp little points will help your new wall stand up to trouble.", "usage": "main", "locale": "es", "text": "Desbloquea Impaler Palisade con tu gema. Esas pequeñas puntas ayudarán a que tu nuevo muro resista los problemas.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA07.mp3"}, {"id": "ES_MA08", "cue": "merge_tutorial.heaven.install_bulwark", "source_id": "MA08", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Now choose Install. There—another layer of protection for your brave little defenders. We’re building something worth holding onto.", "usage": "main", "locale": "es", "text": "Ahora elige Install. Ahí está, otra capa de protección para tus valientes defensores. Estamos construyendo algo que vale la pena cuidar.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA08.mp3"}, {"id": "ES_MA09", "cue": "merge_tutorial.heaven.collect_cannon_coins", "source_id": "MA09", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Gather a Waycoin pile for the next improvement. A little support from the artillery commander will help your line last longer.", "usage": "main", "locale": "es", "text": "Recoge un montón de Waycoins para la próxima mejora. Un poco de apoyo del comandante de artillería ayudará a que tu línea dure más.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA09.mp3"}, {"id": "ES_MA10", "cue": "merge_tutorial.heaven.collect_cannon_gem", "source_id": "MA10", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Follow the guide to the gem. Keep it close; it will unlock a cannon that helps mend your defense.", "usage": "main", "locale": "es", "text": "Sigue la guía hasta la gema. Guárdala bien; desbloqueará un cañón que ayuda a reparar tu defensa.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA10.mp3"}, {"id": "ES_MA11", "cue": "merge_tutorial.heaven.talk_commander", "source_id": "MA11", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "The artillery commander is ready at the right-hand gun. Follow the guide and speak with him. Even the strongest line deserves a little care.", "usage": "main", "locale": "es", "text": "El comandante de artillería te espera junto al cañón de la derecha. Sigue la guía y habla con él. Hasta la línea más fuerte merece un poquito de cuidado.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA11.mp3"}, {"id": "ES_MA12", "cue": "merge_tutorial.heaven.unlock_cannon", "source_id": "MA12", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Unlock for the Heal cannon. Your gem will open a gentler kind of artillery—one that helps keep your defense standing.", "usage": "main", "locale": "es", "text": "Elige Unlock para el cañón Heal. Tu gema abrirá el camino a una artillería más amable, que ayuda a mantener tu defensa en pie.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA12.mp3"}, {"id": "ES_MA13", "cue": "merge_tutorial.heaven.install_cannon", "source_id": "MA13", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Install, and let the Heal cannon join your defense. A little kindness in the right place can make a wonderful difference.", "usage": "main", "locale": "es", "text": "Elige Install y deja que el cañón Heal se una a tu defensa. Un poquito de bondad en el lugar adecuado puede hacer maravillas.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA13.mp3"}, {"id": "ES_MA14", "cue": "merge_tutorial.heaven.power_lesson", "source_id": "MA14", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "You’ve earned a new power. Open Powers and choose one, then Commit. Magnet is a helpful first choice for bringing scattered loot a little closer.", "usage": "main", "locale": "es", "text": "Ganaste un nuevo poder. Abre Powers, elige uno y usa Commit. Magnet es una buena primera opción para acercar el botín disperso.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA14.mp3"}, {"id": "ES_MA15", "cue": "merge_tutorial.heaven.collect_upgrade_coins", "source_id": "MA15", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Let’s gather a few more Waycoins for your eggs. Follow the guide; a stronger line begins with one small improvement at a time.", "usage": "main", "locale": "es", "text": "Recojamos unas Waycoins más para tus huevos. Sigue la guía; una línea más fuerte empieza con una pequeña mejora a la vez.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA15.mp3"}, {"id": "ES_MA16", "cue": "merge_tutorial.heaven.collect_upgrade_coins.auto", "source_id": "MA16", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your Coin Pup will gather what we need. Give that faithful little helper a moment, and we’ll improve your defense together.", "usage": "main", "locale": "es", "text": "Tu Coin Pup recogerá lo que necesitamos. Dale un momento a ese fiel ayudante y mejoraremos tu defensa juntos.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA16.mp3"}, {"id": "ES_MA17", "cue": "merge_tutorial.heaven.upgrade_eggs", "source_id": "MA17", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Let’s give your line a little more strength. Buy a couple of eggs, then use Deploy Best. If you already have an egg, placing it works too.", "usage": "main", "locale": "es", "text": "Démosle un poquito más de fuerza a tu línea. Compra un par de huevos y usa Deploy Best. Si ya tienes un huevo, colocarlo también sirve.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA17.mp3"}, {"id": "ES_MA18", "cue": "merge_tutorial.heaven.upgrade_eggs.deploy", "source_id": "MA18", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your eggs are ready. Choose Deploy Best to combine matching eggs or place one on the line. Either is a good next step.", "usage": "main", "locale": "es", "text": "Tus huevos están listos. Elige Deploy Best para combinar huevos iguales o colocar uno en la línea. Cualquiera de las dos opciones es un buen paso.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA18.mp3"}, {"id": "ES_MA19", "cue": "merge_tutorial.heaven.slots_lesson", "source_id": "MA19", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Let’s make room for your powers to grow. In Powers, choose two extra enhancement slots, then Commit. You can change your picks before committing.", "usage": "main", "locale": "es", "text": "Hagamos espacio para que crezcan tus poderes. En Powers, elige dos ranuras de mejora adicionales y usa Commit. Puedes cambiar tus elecciones antes de confirmar.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA19.mp3"}, {"id": "ES_MA20", "cue": "merge_tutorial.heaven.enhance_lesson", "source_id": "MA20", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Now we can give a power a little more sparkle. Choose it in Powers, and let’s fit an enhancement into one of its slots.", "usage": "main", "locale": "es", "text": "Ahora podemos darle un poquito más de brillo a un poder. Elígelo en Powers y pongamos una mejora en una de sus ranuras.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA20.mp3"}, {"id": "ES_MA21", "cue": "merge_tutorial.heaven.talk_quartermaster", "source_id": "MA21", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Meet Macros, your Quartermaster. He has boosts, enhancements, and optional training whenever you want them. There’s no need to visit right now; your adventure is yours.", "usage": "main", "locale": "es", "text": "Te presento a Macros, tu intendente. Tiene potenciadores, mejoras y entrenamiento opcional cuando quieras. No hace falta visitarlo ahora; esta aventura es tuya.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA21.mp3"}, {"id": "ES_MA22", "cue": "merge_tutorial.heaven.after_setup", "source_id": "MA22", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your guardians are ready. Try spreading your defense across more hatchers; two smaller squads can serve you better than one powerful egg. It’s your choice.", "usage": "main", "locale": "es", "text": "Tus guardianes están listos. Prueba repartir tu defensa entre más incubadoras. Dos escuadrones pequeños pueden ayudarte más que un solo huevo poderoso. Tú decides.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA22.mp3"}, {"id": "ES_MA23", "cue": "merge_tutorial.heaven.after_bulwark", "source_id": "MA23", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your wall is in place. Let’s see how the line holds now. Each small improvement gives your guardians a little more breathing room.", "usage": "main", "locale": "es", "text": "Tu muro está en su lugar. Veamos cómo resiste la línea ahora. Cada pequeña mejora les da un poquito más de respiro a tus guardianes.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA23.mp3"}, {"id": "ES_MA24", "cue": "merge_tutorial.heaven.after_cannon", "source_id": "MA24", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your Heal cannon is ready. Keep the defense going; there’s a new power waiting a little further along.", "usage": "main", "locale": "es", "text": "Tu cañón Heal está listo. Sigue defendiendo; un nuevo poder te espera un poquito más adelante.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA24.mp3"}, {"id": "ES_MA25", "cue": "merge_tutorial.heaven.after_power", "source_id": "MA25", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "That power is yours now. Try it when it will help, and keep your defense growing. You’re finding your own way.", "usage": "main", "locale": "es", "text": "Ese poder ya es tuyo. Úsalo cuando te ayude y sigue haciendo crecer tu defensa. Estás encontrando tu propio camino.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA25.mp3"}, {"id": "ES_MA26", "cue": "merge_tutorial.heaven.after_upgrade", "source_id": "MA26", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "That’s a little stronger already. Let your guardians get back to work. You can keep improving the line as you go.", "usage": "main", "locale": "es", "text": "Ya está un poquito más fuerte. Deja que tus guardianes vuelvan al trabajo. Puedes seguir mejorando la línea mientras avanzas.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA26.mp3"}, {"id": "ES_MA27", "cue": "merge_tutorial.heaven.after_slots", "source_id": "MA27", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your extra slots are ready. Keep the line steady, and soon we’ll give one of your powers a useful enhancement.", "usage": "main", "locale": "es", "text": "Tus ranuras adicionales están listas. Mantén firme la línea, y pronto le daremos una mejora útil a uno de tus poderes.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA27.mp3"}, {"id": "ES_MA28", "cue": "merge_tutorial.heaven.after_enhance", "source_id": "MA28", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "There—that power has a little more to offer. Keep going; you’ve nearly learned everything you need to manage this defense yourself.", "usage": "main", "locale": "es", "text": "Ahí está, ese poder tiene un poquito más que ofrecer. Sigue adelante; ya casi sabes todo lo necesario para cuidar de esta defensa por tu cuenta.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA28.mp3"}, {"id": "ES_MA29", "cue": "merge_tutorial.heaven.completion", "source_id": "MA29", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "You’ve learned the essentials, little light. Keep growing your defense, explore when you wish, and remember: you can always take a breather in Farm and Fight.", "usage": "main", "locale": "es", "text": "Aprendiste lo esencial, pequeña luz. Sigue haciendo crecer tu defensa y explora cuando quieras. Recuerda que siempre puedes tomar un respiro en Farm and Fight.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA29.mp3"}, {"id": "ES_MA30", "cue": "merge_tutorial.heaven.resume", "source_id": "MA30", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Welcome back, little light. Your progress is still here. Follow the guide, and we’ll pick up with the step you were working on.", "usage": "main", "locale": "es", "text": "Bienvenido de nuevo, pequeña luz. Tu progreso sigue aquí. Sigue la guía, y retomaremos el paso en el que estabas trabajando.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA30.mp3"}, {"id": "ES_MA31", "cue": "merge_tutorial.heaven.reminder", "source_id": "MA31", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Whenever you’re ready, little light, the glowing guide will show your next step. Take your time. We’ll build this together.", "usage": "reminder", "locale": "es", "text": "Cuando estés listo, pequeña luz, la guía brillante te mostrará el siguiente paso. Sin prisa. Lo construiremos juntos.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA31.mp3"}, {"id": "ES_MA32", "cue": "merge_tutorial.heaven.help.power", "source_id": "MA32", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Magnet is a helpful beginning. Choose the power you want, then Commit when you’re happy with your choice.", "usage": "help", "locale": "es", "text": "Magnet es un buen comienzo. Elige el poder que quieras y usa Commit cuando estés contento con tu elección.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA32.mp3"}, {"id": "ES_MA33", "cue": "merge_tutorial.heaven.help.slots", "source_id": "MA33", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose two extra slots on powers you own. You can put them where they’ll help most, and change your picks before you Commit.", "usage": "help", "locale": "es", "text": "Elige dos ranuras adicionales en poderes que ya tengas. Ponlas donde más ayuden; puedes cambiar tus elecciones antes de usar Commit.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA33.mp3"}, {"id": "ES_MA34", "cue": "merge_tutorial.heaven.help.commit", "source_id": "MA34", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your choices are ready. Choose Commit to make them yours, or adjust them first if something doesn’t feel right.", "usage": "help", "locale": "es", "text": "Tus elecciones están listas. Usa Commit para confirmarlas, o ajústalas primero si algo no te convence.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA34.mp3"}, {"id": "ES_MA35", "cue": "merge_tutorial.heaven.help.owned", "source_id": "MA35", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose one of your powers. Then we can look at its slots and find a home for that enhancement.", "usage": "help", "locale": "es", "text": "Elige uno de tus poderes. Después veremos sus ranuras y encontraremos un hogar para esa mejora.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA35.mp3"}, {"id": "ES_MA36", "cue": "merge_tutorial.heaven.help.slot", "source_id": "MA36", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose an empty enhancement slot on that power. A small space, with room for something helpful.", "usage": "help", "locale": "es", "text": "Elige una ranura de mejora vacía en ese poder. Un pequeño espacio para algo útil.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA36.mp3"}, {"id": "ES_MA37", "cue": "merge_tutorial.heaven.help.enhancement", "source_id": "MA37", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose an enhancement that fits your power. A Focus enhancement can help it use less of your energy.", "usage": "help", "locale": "es", "text": "Elige una mejora compatible con tu poder. Una mejora Focus puede ayudar a que gaste menos energía.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA37.mp3"}, {"id": "ES_MA38", "cue": "merge_tutorial.heaven.help.apply", "source_id": "MA38", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "That looks ready. Choose Apply to place the enhancement into your power. Then let’s see what it can do.", "usage": "help", "locale": "es", "text": "Ya parece listo. Elige Apply para colocar la mejora en tu poder. Después veremos qué puede hacer.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA38.mp3"}, {"id": "ES_MA39", "cue": "merge_tutorial.heaven.help.origin", "source_id": "MA39", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "This choice shapes the powers you can learn. Take a moment to explore the origins, and choose the one that feels right for you.", "usage": "help", "locale": "es", "text": "Esta elección define los poderes que puedes aprender. Tómate un momento para explorar los orígenes y elige el que más te guste.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA39.mp3"}, {"id": "ES_MA40", "cue": "merge_tutorial.heaven.help.origin_review", "source_id": "MA40", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Take one last look before you confirm. Your origin is a permanent choice, so choose the path you truly want to follow.", "usage": "help", "locale": "es", "text": "Revísalo una última vez antes de confirmar. Tu origen es una elección permanente, así que elige el camino que de verdad quieras seguir.", "speaker": "angel", "track": "merge", "file": "../merge_tutorial_localized/es/angel/ES_MA40.mp3"}, {"id": "ES_MD01", "cue": "merge_tutorial.hell.collect_setup", "source_id": "MD01", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "So, this patch of Hell is yours. Collect the Waycoins along the glowing trail, then the gem. Even impending disaster needs a starting budget.", "usage": "main", "locale": "es", "text": "Así que este rinconcito del Infierno es tuyo. Recoge las Waycoins del camino brillante y luego la gema. Hasta un desastre anunciado necesita un presupuesto inicial.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD01.mp3"}, {"id": "ES_MD02", "cue": "merge_tutorial.hell.collect_setup.auto", "source_id": "MD02", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "You brought a Coin Pup. Delegating already? Sensible. Let it collect the coins and gem while you practice looking like you’re in charge.", "usage": "main", "locale": "es", "text": "Trajiste un Coin Pup. ¿Ya estás delegando? Sensato. Deja que recoja las monedas y la gema mientras practicas esa cara de estar al mando.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD02.mp3"}, {"id": "ES_MD03", "cue": "merge_tutorial.hell.create_five", "source_id": "MD03", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Five Earth Eggs. Use Buy Egg until you have them. Yes, eggs. Apparently that is what stands between you and utter embarrassment.", "usage": "main", "locale": "es", "text": "Cinco Huevos de Tierra. Usa Buy Egg hasta tenerlos. Sí, huevos. Al parecer, eso es lo que te separa de la vergüenza absoluta.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD03.mp3"}, {"id": "ES_MD04", "cue": "merge_tutorial.hell.deploy_best", "source_id": "MD04", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Deploy Best. It puts those eggs to work on your defense line. They cannot defend much while you leave them admiring the board.", "usage": "main", "locale": "es", "text": "Elige Deploy Best. Pondrá esos huevos a trabajar en tu línea de defensa. No pueden defender mucho si los dejas admirando el tablero.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD04.mp3"}, {"id": "ES_MD05", "cue": "merge_tutorial.hell.collect_workshop_coins", "source_id": "MD05", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Fetch a Waycoin pile. The engineer does not accept hopeful expressions as payment. I asked.", "usage": "main", "locale": "es", "text": "Recoge un montón de Waycoins. El ingeniero no acepta miradas de esperanza como pago. Ya pregunté.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD05.mp3"}, {"id": "ES_MD06", "cue": "merge_tutorial.hell.talk_engineer", "source_id": "MD06", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "The engineer is waiting at the gold line. Go speak with him. A wall might compensate for that optimistic approach to survival.", "usage": "main", "locale": "es", "text": "El ingeniero espera en la línea dorada. Ve a hablar con él. Quizá un muro compense esa manera tan optimista de intentar sobrevivir.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD06.mp3"}, {"id": "ES_MD07", "cue": "merge_tutorial.hell.unlock_bulwark", "source_id": "MD07", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Unlock the Impaler Palisade. One gem buys a rather pointed objection to trespassers. Finally, a decorating choice I approve of.", "usage": "main", "locale": "es", "text": "Desbloquea Impaler Palisade. Una gema compra una objeción bastante puntiaguda contra los intrusos. Por fin una decoración que apruebo.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD07.mp3"}, {"id": "ES_MD08", "cue": "merge_tutorial.hell.install_bulwark", "source_id": "MD08", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Install. Owning a wall and actually putting it in the enemy’s way are, regrettably, different things.", "usage": "main", "locale": "es", "text": "Elige Install. Tener un muro y ponerlo en el camino del enemigo son, lamentablemente, cosas distintas.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD08.mp3"}, {"id": "ES_MD09", "cue": "merge_tutorial.hell.collect_cannon_coins", "source_id": "MD09", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Another Waycoin pile, please. Artillery is wonderfully persuasive, but apparently persuasion has installation costs.", "usage": "main", "locale": "es", "text": "Otro montón de Waycoins, por favor. La artillería es muy persuasiva, pero al parecer la persuasión tiene gastos de instalación.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD09.mp3"}, {"id": "ES_MD10", "cue": "merge_tutorial.hell.collect_cannon_gem", "source_id": "MD10", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Collect that gem. We’re unlocking a Heal cannon. Try not to look so disappointed that it does something useful.", "usage": "main", "locale": "es", "text": "Recoge esa gema. Vamos a desbloquear un cañón Heal. Intenta no parecer tan decepcionado porque haga algo útil.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD10.mp3"}, {"id": "ES_MD11", "cue": "merge_tutorial.hell.talk_commander", "source_id": "MD11", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Your artillery commander is waiting by the right-hand gun. Go introduce yourself before your defense introduces itself to the floor.", "usage": "main", "locale": "es", "text": "Tu comandante de artillería espera junto al cañón de la derecha. Ve a presentarte antes de que tu defensa termine presentándose ante el suelo.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD11.mp3"}, {"id": "ES_MD12", "cue": "merge_tutorial.hell.unlock_cannon", "source_id": "MD12", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Unlock Heal with your gem. Yes, healing artillery. Apparently keeping your defenders alive is part of the strategy.", "usage": "main", "locale": "es", "text": "Desbloquea Heal con tu gema. Sí, artillería que cura. Al parecer, mantener vivos a tus defensores es parte de la estrategia.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD12.mp3"}, {"id": "ES_MD13", "cue": "merge_tutorial.hell.install_cannon", "source_id": "MD13", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Install. Let the Heal cannon earn its place. Your defenders have been very patient with your management so far.", "usage": "main", "locale": "es", "text": "Elige Install. Deja que el cañón Heal se gane su lugar. Hasta ahora, tus defensores han tenido mucha paciencia con tu gestión.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD13.mp3"}, {"id": "ES_MD14", "cue": "merge_tutorial.hell.power_lesson", "source_id": "MD14", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "You’ve earned a power. Open Powers, choose one, and Commit. Magnet can collect scattered loot. Anything that reduces your wandering is progress.", "usage": "main", "locale": "es", "text": "Ganaste un poder. Abre Powers, elige uno y usa Commit. Magnet recoge el botín disperso. Cualquier cosa que reduzca tus paseos es un avance.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD14.mp3"}, {"id": "ES_MD15", "cue": "merge_tutorial.hell.collect_upgrade_coins", "source_id": "MD15", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Gather some more Waycoins. Your eggs could use an improvement, and glaring at them has achieved remarkably little.", "usage": "main", "locale": "es", "text": "Recoge más Waycoins. A tus huevos les vendría bien una mejora, y mirarlos con mala cara ha servido de muy poco.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD15.mp3"}, {"id": "ES_MD16", "cue": "merge_tutorial.hell.collect_upgrade_coins.auto", "source_id": "MD16", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Let your Coin Pup gather the funds. At least one member of this operation understands the assignment.", "usage": "main", "locale": "es", "text": "Deja que tu Coin Pup reúna los fondos. Al menos alguien en esta operación entiende cuál es su tarea.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD16.mp3"}, {"id": "ES_MD17", "cue": "merge_tutorial.hell.upgrade_eggs", "source_id": "MD17", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Time to improve those eggs. Buy a couple, then use Deploy Best. Already have one waiting? Place it. I’m mocking you, not trying to trap you.", "usage": "main", "locale": "es", "text": "Hora de mejorar esos huevos. Compra un par y usa Deploy Best. ¿Ya tienes uno esperando? Colócalo. Me burlo de ti, no intento atraparte.", "speaker": "demon", "track": "merge", "file": "../merge_tutorial_localized/es/demon/ES_MD17.mp3"}, {"id": "ES_MD18", "cue": "merge_tutorial.hell.upgrade_eggs.deploy", "source_id": "MD18", "source_catalog": "configs/merge_tutorial_voice_lines.lua", "english_meaning": "Choose Deploy Best. It can combine matching egg
